        var html = '<html><head><title>' + title + '</title><style>body{font-family:system-ui;margin:20px;font-size:13px}.card{border:1px solid #ddd;padding:12px;margin-bottom:12px;border-radius:6px;page-break-inside:avoid}dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}dt{font-weight:bold;font-size:13px;opacity:0.7}dd{margin:0;font-size:13px}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:4px 8px;text-align:left;font-size:13px}th{background:#f5f5f5}.embed{margin:8px 0;padding:8px;background:#f9f9f9;border-radius:4px}.embed h4{margin:0 0 4px;font-size:13px;opacity:0.7}h1,h2,h3,h4,h5,h6{font-size:13px;margin:6px 0}@media print{button{display:none}}</style></head><body>';
        html += '<h2>' + title + '</h2>';
        if (this.useCardLayout) {
          this.sortedData.forEach(function(row) {
            html += '<div class="card"><dl>';
            cols.forEach(function(c) {
              if (!self.isColumnHidden(c, row)) html += '<dt>' + (self.t('field.' + c) || c) + '</dt><dd>' + (row[c] || '') + '</dd>';
              self.embedItems.forEach(function(ei) { if (ei.config.afterColumn === c && self._printable(ei)) html += '</dl>' + self._printEmbed(ei) + '<dl>'; });
            });
            html += '</dl>';
            self.embedItems.forEach(function(ei) { if (!ei.config.afterColumn && self._printable(ei)) html += self._printEmbed(ei); });
            html += '</div>';
          });
        } else {
          var afterCol = null;
          self.embedItems.forEach(function(ei) { if (ei.config.afterColumn) afterCol = ei.config.afterColumn; });
          var colIdx = afterCol ? cols.indexOf(afterCol) : -1;
          var colsBefore = colIdx >= 0 ? cols.slice(0, colIdx + 1) : cols;
          var colsAfter = colIdx >= 0 ? cols.slice(colIdx + 1) : [];

          html += '<table><thead><tr>';
          colsBefore.forEach(function(c) { html += '<th>' + (self.t('field.' + c) || c) + '</th>'; });
          html += '</tr></thead><tbody>';
          this.sortedData.forEach(function(row) {
            html += '<tr>'; colsBefore.forEach(function(c) { html += '<td>' + (row[c] || '') + '</td>'; }); html += '</tr>';
          });
          html += '</tbody></table>';

          self.embedItems.forEach(function(ei) { if (ei.config.afterColumn && ei.rows.length) html += self._printEmbed(ei); });

          if (colsAfter.length) {
            html += '<table><thead><tr>';
            colsAfter.forEach(function(c) { html += '<th>' + (self.t('field.' + c) || c) + '</th>'; });
            html += '</tr></thead><tbody>';
            self.sortedData.forEach(function(row) {
              html += '<tr>'; colsAfter.forEach(function(c) { html += '<td>' + (row[c] || '') + '</td>'; }); html += '</tr>';
            });
            html += '</tbody></table>';
          }
          self.embedItems.forEach(function(ei) { if (!ei.config.afterColumn && ei.rows.length) html += self._printEmbed(ei); });
        }
        html += '</body></html>';
        var w = window.open('', '_blank');
        w.document.write(html);
        w.document.close();
        w.print();
      },

      embedLayout: function(ei) {
        return ei.config.layout || 'table';
      },

      _printable: function(ei) { return ei.isDoc ? !!ei.show : !!(ei.rows && ei.rows.length); },
      _printEmbed: function(ei) {
        var self = this;
        if (ei.isDoc) {
          var dh = ei.config.bare ? '<div>' : '<div class="embed">';
          (ei.blocks || []).forEach(function(b) {
            if (b.html) { dh += b.html; return; }
            var cols = self.embedCols(b.embedType, b.embedName), rows = self.embedRows(b.embedType, b.embedName, b.embedPart);
            if (!rows.length) return;
            dh += '<table><thead><tr>';
            cols.forEach(function(c) { dh += '<th>' + (self.t('field.' + c) || c) + '</th>'; });
            dh += '</tr></thead><tbody>';
            rows.forEach(function(r) { dh += '<tr>'; cols.forEach(function(c) { dh += '<td>' + (r[c] || '') + '</td>'; }); dh += '</tr>'; });
            dh += '</tbody></table>';
          });
          return dh + '</div>';
        }
        var html = ei.config.bare ? '<div>' : '<div class="embed">';
        var hdr = ei.config.header && self.t(ei.config.header) !== ei.config.header ? self.t(ei.config.header) : '';
        if (hdr) html += '<h4>' + hdr + '</h4>';
        html += '<table><thead><tr>';
        ei.columns.forEach(function(c) { html += '<th>' + (self.t('field.' + c) || c) + '</th>'; });
        html += '</tr></thead><tbody>';
        ei.rows.forEach(function(r) { html += '<tr>'; ei.columns.forEach(function(c) { html += '<td>' + (r[c] || '') + '</td>'; }); html += '</tr>'; });
        html += '</tbody></table>';
        var ftr = ei.config.footer && self.t(ei.config.footer) !== ei.config.footer ? self.t(ei.config.footer) : '';
        if (ftr) html += '<p style="font-size:13px;opacity:0.6;margin:4px 0 0">' + ftr + '</p>';
        html += '</div>';
        return html;
      },

      printCard: function(item) {
        var self = this;
        var cols = this.visibleCols;
        var title = item[cols[0]] || item.id;
        var html = '<html><head><title>' + title + '</title><style>body{font-family:system-ui;margin:20px;font-size:13px}dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}dt{font-weight:bold;font-size:13px;opacity:0.7}dd{margin:0;font-size:13px}.embed{margin:12px 0;padding:8px;background:#f9f9f9;border-radius:4px}.embed h4{margin:0 0 4px;font-size:13px;opacity:0.7}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:3px 6px;text-align:left;font-size:13px}th{background:#f5f5f5}h1,h2,h3,h4,h5,h6{font-size:13px;margin:6px 0}@media print{button{display:none}}</style></head><body>';
        html += '<dl>';
        cols.forEach(function(c) {
          if (!self.isColumnHidden(c, item)) { html += '<dt>' + (self.t('field.' + c) || c) + '</dt><dd>' + (item[c] || '') + '</dd>'; }
          self.embedItems.forEach(function(ei) { if (ei.config.afterColumn === c && self._printable(ei)) html += '</dl>' + self._printEmbed(ei) + '<dl>'; });
        });
        html += '</dl>';
        var pself = this;
        this.embedItems.forEach(function(ei) { if (!ei.config.afterColumn && self._printable(ei)) html += pself._printEmbed(ei); });
        html += '</body></html>';
        var w = window.open('', '_blank');
        w.document.write(html);
        w.document.close();
        w.print();
      }
    },

    watch: {
      viewingArchive: function() { this.loadTableData(); },
      sortedData: function(val) { if (this.currentConfig.collapsed && val.length) this.expandedCard = val[0].id; }
    },

    mounted: function() {
      var self = this;
      window.addEventListener('resize', function() { self.mobile = window.innerWidth < 768; self.windowWidth = window.innerWidth; });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          var el = e.target;
          if (el.hasAttribute('contenteditable') || el.tagName === 'SELECT' || el.tagName === 'INPUT') {
            e.preventDefault();
            el.blur();
            // Table cells: move to next cell
            var td = el.closest('td');
            if (td) {
              var next = td.nextElementSibling;
              while (next && !next.querySelector('[contenteditable], select, input, .v-autocomplete input')) next = next.nextElementSibling;
              if (!next) {
                var tr = td.closest('tr');
                var nextRow = tr && tr.nextElementSibling;
                if (nextRow) next = nextRow.querySelector('td');
                while (next && !next.querySelector('[contenteditable], select, input, .v-autocomplete input')) next = next.nextElementSibling;
              }
              if (next) { var t = next.querySelector('[contenteditable], select, input, .v-autocomplete input'); if (t) t.focus(); }
              return;
            }
            // List items: move to next sibling or add new
            var li = el.closest('.v-list-item');
            if (li) {
              var nextLi = li.nextElementSibling;
              if (nextLi) {
                var c = nextLi.querySelector('[contenteditable]');
                if (c) { c.focus(); return; }
              }
              // At last item: find the "Add item" button in the parent group
              var group = li.closest('.v-list-group__items') || li.closest('.v-list');
              if (group) {
                var addBtn = group.querySelector('.v-btn .mdi-plus') || group.parentElement.querySelector(':scope > .v-list-item:last-child .v-btn');
                if (addBtn) { addBtn.closest('button, .v-btn').click(); return; }
              }
            }
          }
        }
      });
      // Probe local server availability for setup UI
      fetch('/api/validateFolder', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{"id":"probe"}' })
        .then(function(r) { if (r.ok) self.hasLocalServer = true; })
        .catch(function() {});
    }
  });

  app.use(vuetify);
  // Self-computing, interactive embed-view: resolves its own cols/rows from the root and
  // delegates editing to the root's ownerId-parameterized methods (saveField/cellReadonly).
  app.component('embed-view', {
    props: { type: { type: String, default: 'view' }, name: { type: String, required: true }, part: { type: String, default: null } },
    computed: {
      cols: function() { if (!appInstance) return []; var cols = appInstance.embedCols(this.type, this.name); if (appInstance.embedHideEmpty(this.type, this.name)) { var rows = this.rows; cols = cols.filter(function(c) { return rows.some(function(r) { return r[c]; }); }); } return cols; },
      rows: function() { return appInstance ? appInstance.embedRows(this.type, this.name, this.part) : []; },
      canMutate: function() { return !this.part && appInstance && appInstance.canMutateEmbed(this.type, this.name); },
      hasArchive: function() { return !this.part && appInstance && appInstance.embedHasArchive(this.type, this.name); },
      layout: function() { return appInstance ? appInstance.embedViewLayout(this.type, this.name) : 'table'; }
    },
    methods: {
      t: function(k) { return appInstance ? appInstance.t(k) : k; },
      colIsDate: function(c) { return appInstance && appInstance.colIsDate(c); },
      colIsList: function(c) { return appInstance && appInstance.colIsList(c); },
      colAllowNew: function(c) { return appInstance && appInstance.colAllowNew(c); },
      colIsRef: function(c) { return appInstance && appInstance.colIsRef(c); },
      getListOptions: function(c) { return appInstance ? appInstance.getListOptions(c) : []; },
      getRefOptions: function(c, item) { return appInstance ? appInstance.getRefOptions(c, item) : []; },
      displayValue: function(c, v) { return appInstance ? appInstance.displayValue(c, v) : v; },
      toDateStr: toDateStr,
      cellRO: function(item, col) { return !!this.part || appInstance.cellReadonly(item, col, this.name); },
      save: function(item, col, val) { return appInstance.saveField(item, col, val, this.name); },
      addToListOnBlur: function(item, col) { return appInstance.addToListOnBlur(item, col); },
      isArmed: function(item) { return appInstance.isArmed('erow:' + item.id); },
      addRow: function() { return appInstance.embedAddRow(this.type, this.name); },
      delRow: function(item) { return appInstance.embedDeleteRow(this.type, this.name, item); },
      archRow: function(item) { return appInstance.embedArchiveRow(this.type, this.name, item); }
    },
    template: '<div>'
      + '<v-list v-if="layout===\'list\'" density="compact" class="my-2">'
      + '<v-list-item v-for="(item, ri) in rows" :key="item.id || ri" class="px-2">'
      + '<template v-slot:default><span v-for="(col, i) in cols" :key="col" style="font-size:0.85rem">{{ colIsDate(col) ? toDateStr(item[col]) : displayValue(col, item[col]) }}<span v-if="i < cols.length - 1" style="opacity:0.3;margin:0 6px">·</span></span></template>'
      + '<template v-slot:append><template v-if="canMutate"><v-btn v-if="hasArchive" icon="mdi-archive-outline" size="x-small" variant="text" @click="archRow(item)"></v-btn><v-btn :icon="isArmed(item) ? \'mdi-check-circle\' : \'mdi-close\'" size="x-small" variant="text" :color="isArmed(item) ? \'error\' : \'\'" @click="delRow(item)"></v-btn></template></template>'
      + '</v-list-item></v-list>'
      + '<div v-else-if="layout===\'card\'" class="my-2">'
      + '<v-card v-for="(item, ri) in rows" :key="item.id || ri" variant="flat" class="ma-2 pa-2" style="border-bottom:1px solid rgb(var(--v-theme-outline),0.2)">'
      + '<div v-for="col in cols" :key="col" class="d-flex align-center mb-1"><span style="min-width:120px;flex-shrink:0;font-size:0.75rem;opacity:0.6;padding-right:8px">{{ t(\'field.\' + col) || col }}</span><span style="opacity:0.8">{{ colIsDate(col) ? toDateStr(item[col]) : displayValue(col, item[col]) }}</span></div>'
      + '<div v-if="canMutate" style="text-align:right"><v-btn v-if="hasArchive" icon="mdi-archive-outline" size="x-small" variant="text" @click="archRow(item)"></v-btn><v-btn :icon="isArmed(item) ? \'mdi-check-circle\' : \'mdi-close\'" size="x-small" variant="text" :color="isArmed(item) ? \'error\' : \'\'" @click="delRow(item)"></v-btn></div>'
      + '</v-card></div>'
      + '<v-table v-else density="compact" class="my-2"><template v-slot:default>'
      + '<thead><tr><th v-for="c in cols" :key="c">{{ t(\'field.\' + c) || c }}</th><th v-if="canMutate"></th></tr></thead>'
      + '<tbody><tr v-for="(item, ri) in rows" :key="item.id || ri"><td v-for="col in cols" :key="col">'
      + '<span v-if="cellRO(item, col)" style="opacity:0.4">{{ colIsDate(col) ? toDateStr(item[col]) : displayValue(col, item[col]) }}</span>'
      + '<v-combobox v-else-if="colIsList(col) && colAllowNew(col)" :model-value="item[col] || \'\'" :items="getListOptions(col)" item-title="title" item-value="value" density="compact" variant="plain" hide-details single-line @update:model-value="save(item, col, $event)" @blur="addToListOnBlur(item, col)"></v-combobox>'
      + '<v-autocomplete v-else-if="colIsList(col)" :model-value="item[col] || \'\'" :items="getListOptions(col)" item-title="title" item-value="value" density="compact" variant="plain" hide-details single-line @update:model-value="save(item, col, $event)"></v-autocomplete>'
      + '<v-autocomplete v-else-if="colIsRef(col)" :model-value="item[col] || \'\'" :items="getRefOptions(col, item)" item-title="title" item-value="value" density="compact" variant="plain" hide-details single-line @update:model-value="save(item, col, $event)"></v-autocomplete>'
      + '<input v-else-if="colIsDate(col)" type="date" :value="toDateStr(item[col])" @change="save(item, col, $event.target.value)" style="border:none;background:transparent;color:inherit;font:inherit">'
      + '<span v-else class="editable-cell" contenteditable @blur="save(item, col, $event.target.textContent)">{{ item[col] || \'\' }}</span>'
      + '</td><td v-if="canMutate" style="white-space:nowrap">'
      + '<v-btn v-if="hasArchive" icon="mdi-archive-outline" size="x-small" variant="text" @click="archRow(item)"></v-btn>'
      + '<v-btn :icon="isArmed(item) ? \'mdi-check-circle\' : \'mdi-close\'" size="x-small" variant="text" :color="isArmed(item) ? \'error\' : \'\'" @click="delRow(item)"></v-btn>'
      + '</td></tr></tbody>'
      + '</template></v-table>'
      + '<v-btn v-if="canMutate" variant="text" size="small" prepend-icon="mdi-plus" @click="addRow">{{ t(\'btn.add\') || \'Add\' }}</v-btn>'
      + '</div>'
  });
  appInstance = app.mount('#vue-app');
}

function init() {
  var folder = localStorage.getItem('app_folder');
  var savedMode = localStorage.getItem('app_mode');
  var instance = appInstance;
  if (savedMode === 'sheets' || savedMode === 'crdt' || savedMode === 'oauth') instance.oauthReady = true;

  if (savedMode === 'firebase') {
    instance.mode = 'firebase';
    instance.loading = true;
    instance.startApp();
    return;
  }

  if (!folder) {
    // On Apps Script, skip local server probe
    if (typeof google !== 'undefined' && google.script) {
      instance.showSetup = true; instance.loading = false;
    } else if (savedMode === 'sheets' || savedMode === 'oauth' || savedMode === 'crdt') {
      instance.mode = savedMode; instance.showSetup = true; instance.loading = false;
    } else {
      fetch('/api/validateFolder', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"id":"local"}' })
        .then(function(r) {
          if (r.ok) { instance.mode = 'local'; instance.showSetup = true; instance.loading = false; }
          else { instance.showSetup = true; instance.loading = false; }
        })
        .catch(function() { instance.showSetup = true; instance.loading = false; });
    }
  } else {
    instance.folderId = folder;
    instance.mode = savedMode || 'sheets';
    instance.startApp();
  }
}

// createVueApp() and init() called by index.html after all scripts loaded
</script>
