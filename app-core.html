      // Mirror propagation helper

        var self = this;

          var hasMirror = false;
          for (var mc in mirrorCols) {
            var mdef = mirrorCols[mc];
            if (mdef && typeof mdef === 'object' && mdef.syncFrom === sourceTable) { hasMirror = true; break; }
          }

          var mKey = self.viewingArchive ? mt + '__archive' : mt;
          var mTab = self.viewingArchive ? (SCHEMA[mt].archivePartition) : (SCHEMA[mt].partition);
          if (action === 'delete') {
            self.dataCache[mKey] = (self.dataCache[mKey] || []).filter(function(r) { return r.id !== id; });
            backend.deleteRow(self.tableMap[mt], id, mTab);
          } else if (action === 'create') {
            var mirrorRow = { id: id, created_at: rowData.created_at || new Date().toISOString(), updated_at: new Date().toISOString() };
            getColumns(mt).forEach(function(c) { if (!mirrorRow[c]) mirrorRow[c] = ''; });
            for (var mc2 in mirrorCols) {
              var md = mirrorCols[mc2];
              if (md && typeof md === 'object' && md.syncFrom) mirrorRow[mc2] = rowData[mc2] || '';

            if (!self.dataCache[mKey]) self.dataCache[mKey] = [];
            self.dataCache[mKey].push(mirrorRow);
            backend.putRow(self.tableMap[mt], mirrorRow, mTab);

            var mCached = self.dataCache[mKey] || [];
            for (var mc3 in mirrorCols) {
              var md2 = mirrorCols[mc3];
              if (md2 && typeof md2 === 'object' && md2.syncFrom === sourceTable) {
                var mr = mCached.find(function(r) { return r.id === id; });
                if (mr) {
                  mr[mc3] = rowData[mc3] || '';
                  mr.updated_at = new Date().toISOString();
                  backend.putRow(self.tableMap[mt], mr, mTab);
                }
              }
            }
          }
        }
        // Reverse: if sourceTable has syncFrom columns, propagate to the source table
        var srcCols = SCHEMA[sourceTable] && SCHEMA[sourceTable].columns;
        if (srcCols && action === 'update') {
          for (var rc in srcCols) {
            var rdef = srcCols[rc];
            if (rdef && typeof rdef === 'object' && rdef.syncFrom) {
              var syncTarget = rdef.syncFrom;
              var stKey = self.viewingArchive ? syncTarget + '__archive' : syncTarget;
              var stTab = self.viewingArchive ? (SCHEMA[syncTarget] && SCHEMA[syncTarget].archivePartition) : (SCHEMA[syncTarget] && SCHEMA[syncTarget].partition);
              var stCached = self.dataCache[stKey] || [];
              var stRow = stCached.find(function(r) { return r.id === id; });
              if (stRow && stRow[rc] !== rowData[rc]) {
                stRow[rc] = rowData[rc] || '';
                stRow.updated_at = new Date().toISOString();
                backend.putRow(self.tableMap[syncTarget], stRow, stTab);
              }
            }
          }
        }

function init() {
