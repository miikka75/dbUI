# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dev

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: dev/package-lock.json
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test

  # Security-rules suites against the Firebase emulators. These guard the access-control model —
  # the layer with the least other coverage — so they gate merges like the unit tests do.
  rules:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dev

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: dev/package-lock.json
    - uses: actions/setup-java@v4   # the Firestore emulator is a JVM
      with:
        distribution: temurin
        java-version: '21'
    - run: npm ci
    - run: npm install -g firebase-tools
    - name: Firestore rules tests
      run: npm run test:rules
    - name: Storage rules tests (cross-service registration gate)
      run: npm run test:storage-rules

  # Playwright end-to-end suite against the real app (dev server + Chromium). vendor/ JS payloads are
  # gitignored, so every run also exercises the SRI-pinned CDN fallbacks in index.html — a stale
  # integrity hash after a version bump fails here instead of in production.
  e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dev

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: dev/package-lock.json
    - run: npm ci
    - run: npx playwright install --with-deps chromium
    - run: npx playwright test
    - name: Upload report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          dev/playwright-report/
          dev/test-results/
        retention-days: 7
