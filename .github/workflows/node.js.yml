# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dev

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: dev/package-lock.json
    - run: npm ci
    - run: npm run build --if-present
    # Type-check the pure domain modules with tsc --checkJs (no build step: allowJs + noEmit, so the
    # shipped .js is read as-is). Catches the class of slip that unit tests only find by value --
    # a shifted positional argument, a Date used as a number.
    - run: npm run typecheck
    # Includes dev/test/supabase-rls.test.js, which executes the real supabase-schema.sql policies
    # against PostgreSQL-in-WASM (@electric-sql/pglite). No service container, Docker or JVM needed —
    # unlike the `rules` job below, it is just another unit test.
    - run: npm test

  # Security-rules suites against the Firebase emulators. These guard the access-control model —
  # the layer with the least other coverage — so they gate merges like the unit tests do.
  rules:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dev

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: dev/package-lock.json
    - uses: actions/setup-java@v4   # the Firestore emulator is a JVM
      with:
        distribution: temurin
        java-version: '21'
    - run: npm ci
    - run: npm install -g firebase-tools
    - name: Firestore rules tests
      run: npm run test:rules
    - name: Storage rules tests (cross-service registration gate)
      run: npm run test:storage-rules
    # The two production policy layers, compared on BEHAVIOUR rather than on source text: one access
    # matrix through the Firestore emulator and through PostgreSQL-in-WASM, asserting the rules are
    # never LOOSER than the RLS. Belongs in this job because it needs the same emulator and JVM.
    - name: Policy differential (firestore.rules vs supabase-schema.sql)
      run: npm run test:differential

  # CDN-fallback integrity check (network-only). The app is self-hosted from committed /vendor assets, so
  # the functional suites never touch the CDN. This job is what keeps the SRI-pinned CDN *fallback* URLs in
  # index.html/style.html honest — it fetches each one and verifies HTTP 200 + that the bytes still hash to
  # the pinned integrity (and match the committed vendor copy). A version bump that forgets to refresh the
  # hash or re-run update-vendor.sh fails HERE. It needs outbound network; keep it out of any offline lane.
  cdn-fallback:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dev

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: dev/package-lock.json
    - run: npm ci
    - run: npm run test:cdn

  # Playwright end-to-end suite against the real app (dev server + Chromium), served from the committed
  # /vendor assets — no CDN at test time, so this lane is deterministic and network-light. The SRI-pinned
  # CDN fallbacks are validated separately by the `cdn-fallback` job above, not exercised here.
  e2e:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./dev

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: dev/package-lock.json
    - uses: actions/setup-java@v4   # the Firestore emulator (used by the Firebase-mode spec) is a JVM
      with:
        distribution: temurin
        java-version: '21'
    - run: npm ci
    - run: npm install -g firebase-tools
    # /vendor/* is GENERATED, not committed (see .gitignore) — only vendor/versions is, and it pins what
    # to fetch. Without this step the app under test falls back to the SRI-pinned jsdelivr URLs on every
    # page load, which makes this lane network-dependent and slow: the exact opposite of what the comment
    # above promises, and invisible because the fallback WORKS. Materialise them once, then the suite is
    # offline and deterministic as intended.
    - name: Materialise the vendored Vue/Vuetify/MDI assets
      run: bash ../update-vendor.sh
    - name: Verify they are actually there (a silent CDN fallback is what this guards)
      run: test -s ../vendor/vue.js && test -s ../vendor/vuetify.js && test -s ../vendor/vuetify.css && test -s ../vendor/mdi.css
    - run: npx playwright install --with-deps chromium
    # Worker count is left to the config's min(8, cores/2), which is 2 on a 4-vCPU runner. Measured on
    # this job: 225s serial, 130s at 2 workers, 104s at 4 -- but at 4 the contention pushes the slowest
    # tests past the suite's 8s per-test timeout (`edit cell saves value` boots the app, sleeps twice
    # and reloads, with no setTimeout override of its own). That timeout is the hang detector; raising
    # it to buy 26s would trade a real guard for a little wall time, so this stays at 2. PW_WORKERS
    # overrides if a bigger runner ever makes 4 comfortable.
    - run: npx playwright test
    - name: Firebase-mode E2E (app against auth/firestore/storage emulators)
      run: npm run test:e2e-firebase
    - name: Upload report on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          dev/playwright-report/
          dev/test-results/
        retention-days: 7
