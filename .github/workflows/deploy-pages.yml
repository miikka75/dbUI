# .github/workflows/deploy-pages.yml
# Deploy the static site to GitHub Pages on every push to main.
#
# The app is plain static files (no build step), so this just uploads the repo root as the Pages
# artifact and publishes it. One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish Pages; one concurrent deploy, newest wins.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The vendored Vue/Vuetify/MDI dists are GENERATED, not committed (see .gitignore), so a plain
      # checkout has none of them. Without this step the deployed app 404s on every /vendor/* asset and
      # each visitor silently falls back to the jsdelivr CDN — inverting the intended "self-host first,
      # CDN only as a resilience fallback" design and making a third party a hard dependency of the
      # production site. Materialise the exact pinned versions from npm, mirroring
      # .claude/hooks/session-start.sh. (update-vendor.sh is deliberately NOT reused: it also rewrites
      # index.html/style.html versions + SRI hashes, which a deploy must never do.)
      - name: Materialise vendored front-end dists
        run: |
          set -euo pipefail
          . vendor/versions          # VUE, VUETIFY, MDI
          tmp="$(mktemp -d)"
          ( cd "$tmp"
            npm pack "vue@${VUE}" "vuetify@${VUETIFY}" "@mdi/font@${MDI}" >/dev/null 2>&1
            for f in *.tgz; do tar xzf "$f"; mv package "${f%.tgz}"; done )
          mkdir -p vendor/fonts
          cp "$tmp/vue-${VUE}/dist/vue.global.prod.js"                      vendor/vue.js
          cp "$tmp/vuetify-${VUETIFY}/dist/vuetify.min.js"                  vendor/vuetify.js
          cp "$tmp/vuetify-${VUETIFY}/dist/vuetify.min.css"                 vendor/vuetify.css
          cp "$tmp/mdi-font-${MDI}/css/materialdesignicons.min.css"         vendor/mdi.css
          cp "$tmp/mdi-font-${MDI}/fonts/materialdesignicons-webfont.woff2" vendor/fonts/materialdesignicons-webfont.woff2
          # The npm mdi css lives under css/ and points at ../fonts/. We serve it flattened as
          # /vendor/mdi.css, where ../fonts/ would resolve to /fonts/ (404) and no glyph would load.
          sed -i 's#\.\./fonts/#./fonts/#g' vendor/mdi.css
          rm -rf "$tmp"
          ls -l vendor/ vendor/fonts/

      # Publish the whole repo root. Excludes below keep secrets / dev-only files out of the public site.
      - name: Prune non-public files
        run: |
          rm -rf .github dev node_modules tests test .git scripts || true
          rm -f supabase-schema.sql firebase-config.json supabase-config.json .env* firebase.json .firebaserc firestore.indexes.json || true
          # Dot-DIRECTORIES. Editor and tooling folders hold local configuration, and .github above is
          # only one of them: .claude/settings.local.json was being published. Keep .nojekyll and any
          # other dotFILE Pages itself needs -- this deletes directories only.
          find . -mindepth 1 -maxdepth 1 -type d -name '.*' ! -name '.git' -exec rm -rf {} + || true
          # Executables, by CLASS. This list used to name split-supabase-commits.bat and nothing else,
          # so make-supabase-pr.bat -- added later, next to it -- shipped. Naming files does not scale;
          # naming extensions does. (update-vendor.sh is safe to drop: the vendor step above has
          # already run, and a deploy must never re-run it.)
          rm -f ./*.sh ./*.bat ./*.cmd ./*.ps1 ./*.exe || true
          # Data export / import bundles carry ROW data. This is the SECOND publish path for the repo
          # root (firebase.json hosting is the other), with its own hand-maintained exclusion list —
          # so the same patterns have to be refused here or the leak just moves to Pages.
          # dev/test/deploy-config.test.js checks both lists against the same filenames.
          rm -f drive-sync-export-*.json *-import.json *-export.json || true
          ls -a

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
