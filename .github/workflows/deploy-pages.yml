# .github/workflows/deploy-pages.yml
# Deploy the static site to GitHub Pages on every push to main.
#
# The app is plain static files (no build step), so this copies the files the site serves into _site/
# and publishes that. One-time setup: repo Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish Pages; one concurrent deploy, newest wins.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The vendored Vue/Vuetify/MDI dists are GENERATED, not committed (see .gitignore), so a plain
      # checkout has none of them. Without this step the deployed app 404s on every /vendor/* asset and
      # each visitor silently falls back to the jsdelivr CDN — inverting the intended "self-host first,
      # CDN only as a resilience fallback" design and making a third party a hard dependency of the
      # production site. Materialise the exact pinned versions from npm, mirroring
      # .claude/hooks/session-start.sh. (update-vendor.sh is deliberately NOT reused: it also rewrites
      # index.html/style.html versions + SRI hashes, which a deploy must never do.)
      - name: Materialise vendored front-end dists
        run: |
          set -euo pipefail
          . vendor/versions          # VUE, VUETIFY, MDI, QRCODE
          tmp="$(mktemp -d)"
          ( cd "$tmp"
            npm pack "vue@${VUE}" "vuetify@${VUETIFY}" "@mdi/font@${MDI}" "qrcode-generator@${QRCODE}" >/dev/null 2>&1
            for f in *.tgz; do tar xzf "$f"; mv package "${f%.tgz}"; done )
          mkdir -p vendor/fonts
          cp "$tmp/vue-${VUE}/dist/vue.global.prod.js"                      vendor/vue.js
          cp "$tmp/vuetify-${VUETIFY}/dist/vuetify.min.js"                  vendor/vuetify.js
          cp "$tmp/vuetify-${VUETIFY}/dist/vuetify.min.css"                 vendor/vuetify.css
          cp "$tmp/mdi-font-${MDI}/css/materialdesignicons.min.css"         vendor/mdi.css
          cp "$tmp/mdi-font-${MDI}/fonts/materialdesignicons-webfont.woff2" vendor/fonts/materialdesignicons-webfont.woff2
          cp "$tmp/qrcode-generator-${QRCODE}/qrcode.js"                    vendor/qrcode.js
          # The npm mdi css lives under css/ and points at ../fonts/. We serve it flattened as
          # /vendor/mdi.css, where ../fonts/ would resolve to /fonts/ (404) and no glyph would load.
          sed -i 's#\.\./fonts/#./fonts/#g' vendor/mdi.css
          rm -rf "$tmp"
          ls -l vendor/ vendor/fonts/

      # PGlite — the WASM Postgres behind the "In this browser" backend. Not fetched above because it is
      # a directory of interdependent files (ESM entry + content-hashed chunks + three binaries loaded by
      # relative URL), so the copy list lives in one script shared with update-vendor.sh. Missing it does
      # not kill the backend (it falls back to jsdelivr, as Vue and Vuetify do) but it does hand every
      # visitor's boot to a third party, which is the one thing that mode exists to avoid. ~17 MB of the
      # published artifact.
      - name: Materialise the PGlite WASM dist
        run: bash scripts/vendor-pglite.sh --force

      # An allowlist, shared with Firebase Hosting: only what scripts/build-site.js lists is published.
      - name: Build the published folder
        run: node scripts/build-site.js && ls -R _site | head -40

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  # Verify what was actually PUBLISHED, not what was committed.
  #
  # dev/test/csp.test.js already fails on source drift -- the meta tag not matching csp.js, the tag
  # sinking below the first fetch. What no unit test can see is the deploy itself: a build step that
  # leaves out a file, Pages serving a stale index.html, or somebody committing a csp.js change
  # without running `npm run csp:sync`. The CSP is delivered as a <meta> tag because Pages cannot send
  # a header, which means the policy is part of the payload and can be broken BY deploying.
  #
  # A separate job, so it checks what Pages serves once the deploy has finished.
  #
  # No token, deliberately: this half needs none. It checks that the site serves an ENFORCING policy
  # positioned above the first fetch, and that the collector is reachable and accepts a report. The
  # round-trip check (did the report actually get STORED) needs DBUI_CSP_REPORT_TOKEN and is left to
  # `npm run check:live` by hand, so this workflow holds no secret and writes nothing but the canary.
  verify:
    name: Verify the deployed policy
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Retry rather than sleep-and-hope. deploy-pages reports success when the deployment is created,
      # but the edge can serve the previous copy for a few seconds, and a false red on an unrelated
      # commit is how a check like this gets ignored and then deleted.
      - name: Check the deployed policy
        env:
          SITE: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -u
          for attempt in 1 2 3 4 5; do
            echo "::group::attempt $attempt"
            if node dev/check-supabase.mjs "${SITE:-https://dbui.ddns.net}"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            [ "$attempt" = 5 ] && break
            echo "not green yet; the edge may still be serving the previous copy. retrying in 20s"
            sleep 20
          done
          echo "::error::The deployed site failed its own policy check. The output above names the fix."
          exit 1
