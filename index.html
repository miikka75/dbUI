<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./icon-512.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <!-- iOS standalone (Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Pre-Vue brand splash: the splash paints before Vuetify exists, so read the brand colors the last
       loaded session cached (per-database schema.theme) from localStorage and drive the splash CSS vars.
       Runs in <head> before the splash markup renders, so no fallback-color flash. Falls back to the
       built-in colors on the first-ever load (no cache yet). -->
  <script>
    (function () {
      try {
        var c = JSON.parse(localStorage.getItem('brand_splash') || 'null'); if (!c) return;
        var mode = localStorage.getItem('app_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var b = c[mode] || c.light; if (!b) return;
        var r = document.documentElement.style;
        if (b.p) r.setProperty('--splash-accent', b.p);
        if (b.bg) r.setProperty('--splash-bg', b.bg);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Instant splash: pure HTML/CSS, painted before any JS runs, so the screen isn't blank during
       the ~1.6s boot (auth + data fetch dominate). Removed when the app's `loading` flips false. -->
  <div id="app-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--splash-bg,#ffffff);z-index:9999;transition:opacity .25s ease">
    <div class="app-splash-spinner"></div>
  </div>
  <style>
    @keyframes app-splash-spin { to { transform: rotate(360deg); } }
    .app-splash-spinner { width:44px;height:44px;border:4px solid rgba(0,0,0,.12);border-top-color:var(--splash-accent,#1976d2);border-radius:50%;animation:app-splash-spin .8s linear infinite; }
    @media (prefers-color-scheme: dark) { #app-splash { background:var(--splash-bg,#121212) !important; } .app-splash-spinner { border-color:rgba(255,255,255,.16);border-top-color:var(--splash-accent,#90caf9); } }
  </style>
  <div id="app-root"></div>
  <script>
    // Boot-phase instrumentation. Each bootMark() records ms-since-navigation into window.__bootPhases
    // (read by the boot-time test / console) AND emits a User Timing mark + a measure span from the
    // previous phase, so the phases show as flags and the deltas as bars in the DevTools Performance
    // panel's "Timings" track (no console pasting needed).
    window.__bootPhases = {};
    var __lastBootMark = null;
    function bootMark(name) {
      var t = performance.now();
      window.__bootPhases[name] = t;
      try {
        if (performance.mark) performance.mark('boot:' + name);
        if (performance.measure && __lastBootMark) {
          performance.measure('boot ' + __lastBootMark + ' \u2192 ' + name, 'boot:' + __lastBootMark, 'boot:' + name);
        }
        __lastBootMark = name;
      } catch (e) {}
    }
    bootMark('loadAppStart');

    async function loadApp() {
      // Shared-link support: persist URL params to localStorage, then read mode.
      // shareLink generates: ?mode=firebase&k=<apiKey>&d=<authDomain>&p=<projectId>
      //                  or: ?mode=sheets&folder=<id>&clientId=<id>
      try {
        var qp = new URLSearchParams(location.search);
        var urlMode = qp.get('mode');
        if (urlMode) {
          if (urlMode === 'firebase') {
            // A firebase config from a link points the app at a whole Firestore project. A crafted link
            // could silently connect a victim to an ATTACKER's project (their schema, their DB collecting
            // whatever the victim then enters). So parse the incoming config and CONFIRM the projectId
            // before trusting it — unless it matches a project already stored (returning user, no reprompt).
            var incoming = null;
            if (qp.get('config')) { try { incoming = JSON.parse(atob(qp.get('config'))); } catch(e) {} }
            else if (qp.get('k') && qp.get('p')) {
              // d= (authDomain) is optional: defaults to <projectId>.firebaseapp.com (the standard
              // Firebase auth domain). Only needed when a custom/non-default authDomain is used.
              incoming = { apiKey: qp.get('k'), authDomain: qp.get('d') || (qp.get('p') + '.firebaseapp.com'), projectId: qp.get('p') };
            }
            if (incoming && incoming.projectId) {
              var trusted = null; try { trusted = JSON.parse(localStorage.getItem('firebase_config') || 'null'); } catch(e) {}
              var known = trusted && trusted.projectId === incoming.projectId;
              if (known || confirm('Connect this app to Firebase project "' + incoming.projectId + '"?\n\nOnly continue if you recognize this project — a shared link can point the app at someone else’s database.')) {
                localStorage.setItem('firebase_config', JSON.stringify(incoming));
                localStorage.setItem('app_mode', 'firebase');
              }
              // Declined -> nothing persisted; app_mode stays whatever it already was (setup screen on a fresh visit).
            }
          } else {
            localStorage.setItem('app_mode', urlMode);
            if (qp.get('folder')) localStorage.setItem('app_folder', qp.get('folder'));
            if (qp.get('clientId')) localStorage.setItem('oauth_client_id', qp.get('clientId'));
          }
          // Strip params from the URL so a refresh doesn't re-apply / leak config
          history.replaceState(null, '', location.origin + location.pathname);
        }
      } catch(e) {}

      var mode = localStorage.getItem('app_mode');
      var backendFile;
      if (mode === 'sheets') { backendFile = '/backend-oauth.js'; }
      else if (mode === 'crdt') { backendFile = '/backend-crdt.js'; }
      else if (mode === 'crdt-local') { backendFile = '/backend-crdt-local.js'; }
      else if (mode === 'firebase') { backendFile = '/backend-firebase.js'; }
      else {
        try {
          var probe = await fetch('/api/validateFolder', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{"id":"probe"}' });
          if (probe.ok) { var pj = await probe.json(); if (pj && pj.valid) backendFile = '/backend-local-client.js'; }
        } catch(e) {}
        if (!backendFile) {
          backendFile = '/backend-oauth.js';
        }
      }

      // Only the MARKUP fragments (styles + Vue templates) are fetched and injected — inserting
      // markup via innerHTML never executes script. All CODE loads as real same-origin <script src>
      // elements (loadScript/loadScriptsOrdered below), so a future Content-Security-Policy needs no
      // script-src 'unsafe-inline': the old execScript() pattern injected every fragment as an
      // inline script, which a meaningful CSP forbids.
      var [styleResp, uiResp] = await Promise.all([
        fetch('/style.html'),
        fetch('/ui.html')
      ]);
      bootMark('fragmentsFetched');

      document.head.insertAdjacentHTML('beforeend', await styleResp.text());
      document.getElementById('app-root').innerHTML = await uiResp.text();
      bootMark('fragmentsApplied');

      // Pure domain modules for every backend (column typing, permission-features, per-list access,
      // calendar geometry + fmtDate, rotation engine, view row pipeline, embed resolution, print). They
      // don't depend on Vue/Vuetify/the SDK, so start downloading them NOW (in parallel, ordered exec)
      // and await just before the schema-loader fragment — they overlap the vue/vuetify/sdk loads for free.
      var appModulesReady = loadScriptsOrdered([
        '/columns.js', '/access-features.js', '/list-access.js', '/calendar.js',
        '/rotation.js', '/rows.js', '/embeds.js', '/print.js', '/pivot.js', '/rsvp.js'
      ]);

      // CDN fallbacks are SRI-pinned (sha384 of the exact npm-package file — jsdelivr /npm/ serves
      // tarball bytes verbatim): a compromised or tampered CDN response fails the integrity check and
      // the script simply doesn't run, instead of executing foreign code with the app's storage/tokens.
      // Update the hash whenever the pinned version changes. The gstatic/GSI SDKs below can't be
      // pinned — Google rotates those bundles in place, so an SRI hash there would break auth.
      await loadScript('/vendor/vue.js').catch(function() { return loadScript('https://cdn.jsdelivr.net/npm/vue@3.5.34/dist/vue.global.prod.js', 'sha384-o/dkigrGbFcEo9IQnKb3UkoDe43ZnvA9D531VRI1eaHuP+QiVLB7YYAxGnIEoe+t'); });
      await loadScript('/vendor/vuetify.js').catch(function() { return loadScript('https://cdn.jsdelivr.net/npm/vuetify@4.0.7/dist/vuetify.min.js', 'sha384-wnK0Mlw0rYYNIBzsFn4aOQ595f/X6hleKb5nrU00buuLaFz5ZPqbwpF4QQTjcDZh'); });
      bootMark('vueLibsLoaded');

      // Shared pure backend helpers (used by Firebase + CRDT backends)
      if (backendFile === '/backend-firebase.js' || backendFile === '/backend-crdt.js' || backendFile === '/backend-crdt-local.js') {
        await loadScript('/backend-helpers.js');
      }

      if (backendFile === '/backend-oauth.js' || backendFile === '/backend-crdt.js') {
        await loadScript('https://accounts.google.com/gsi/client');
      }
      if (backendFile === '/backend-firebase.js') {
        await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js');
      }
      bootMark('sdkLoaded');

      // The domain modules (kicked off right after fragmentsApplied) must be executed before
      // schema-loader + app-core, which call them as globals.
      await appModulesReady;
      await loadScriptsOrdered(['/schema-loader.js', '/app-core.js']);
      createVueApp();
      bootMark('vueMounted');
      // Load shared auth before backend for OAuth/CRDT(Drive)
      if (backendFile === '/backend-oauth.js' || backendFile === '/backend-crdt.js') {
        await loadScriptsOrdered(['/auth-oauth.js', '/drive-helpers.js']);
      }
      // Dev-server client helpers (_post + backend_users) shared by local + crdt-local
      if (backendFile === '/backend-local-client.js' || backendFile === '/backend-crdt-local.js') {
        await loadScript('/dev-client.js');
      }
      // Load shared CRDT modules (engine + IDB storage + transport + unified backend)
      // for both Drive CRDT and local CRDT — they differ only in the transport.
      if (backendFile === '/backend-crdt.js' || backendFile === '/backend-crdt-local.js') {
        var transportFile = backendFile === '/backend-crdt.js' ? '/transport-drive.js' : '/transport-local.js';
        await loadScriptsOrdered(['/crdt-engine.js', '/storage-idb.js', transportFile, '/crdt-backend.js']);
      }
      // Load Firestore storage adapter for Firebase mode
      if (backendFile === '/backend-firebase.js') {
        await loadScript('/storage-firestore.js');
      }
      await loadScript(backendFile);
      // For OAuth/CRDT(Drive): handle auth
      if (backendFile === '/backend-oauth.js' || backendFile === '/backend-crdt.js') {
        if (!localStorage.getItem('app_folder')) {
          appInstance.showSetup = true; appInstance.loading = false;
        } else if (sessionStorage.getItem('oauth_token')) {
          // Token cached: init directly (backend is now loaded)
          init();
        } else {
          appInstance.needsReauth = true; appInstance.loading = false;
        }
      }
      // Firebase: auth handled by onAuthStateChanged in backend-firebase.js
    }

    function loadScript(src, integrity) {
      return new Promise(function(resolve, reject) {
        var s = document.createElement('script');
        s.src = src; s.onload = resolve; s.onerror = reject;
        if (integrity) { s.integrity = integrity; s.crossOrigin = 'anonymous'; }
        document.body.appendChild(s);
      });
    }

    // Load several same-origin scripts: download in PARALLEL, execute in the given order. async=false on
    // a dynamically-inserted script keeps insertion-order execution while allowing concurrent download —
    // ordering matters (rotation.js/rows.js capture calendar.js's fmtDate global at load time). Used to
    // fetch the pure domain modules concurrently instead of as a serial await chain.
    function loadScriptsOrdered(srcs) {
      return Promise.all(srcs.map(function(src) {
        return new Promise(function(resolve, reject) {
          var s = document.createElement('script');
          s.src = src; s.async = false;
          s.onload = resolve; s.onerror = reject;
          document.body.appendChild(s);
        });
      }));
    }

    loadApp();

    // Register minimal service worker (enables PWA install prompt). Best-effort.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function() {});
      });
    }
  </script>
</body>
</html>
