<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./icon-512.png">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <!-- iOS standalone (Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Pre-Vue brand splash: the splash paints before Vuetify exists, so read the brand colors the last
       loaded session cached (per-database schema.theme) from localStorage and drive the splash CSS vars.
       Runs in <head> before the splash markup renders, so no fallback-color flash. Falls back to the
       built-in colors on the first-ever load (no cache yet). -->
  <script>
    (function () {
      try {
        var c = JSON.parse(localStorage.getItem('brand_splash') || 'null'); if (!c) return;
        var mode = localStorage.getItem('app_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        var b = c[mode] || c.light; if (!b) return;
        var r = document.documentElement.style;
        if (b.p) r.setProperty('--splash-accent', b.p);
        if (b.bg) r.setProperty('--splash-bg', b.bg);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Instant splash: pure HTML/CSS, painted before any JS runs, so the screen isn't blank during
       the ~1.6s boot (auth + data fetch dominate). Removed when the app's `loading` flips false. -->
  <div id="app-splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--splash-bg,#ffffff);z-index:9999;transition:opacity .25s ease">
    <div class="app-splash-spinner"></div>
  </div>
  <style>
    @keyframes app-splash-spin { to { transform: rotate(360deg); } }
    .app-splash-spinner { width:44px;height:44px;border:4px solid rgba(0,0,0,.12);border-top-color:var(--splash-accent,#1976d2);border-radius:50%;animation:app-splash-spin .8s linear infinite; }
    @media (prefers-color-scheme: dark) { #app-splash { background:var(--splash-bg,#121212) !important; } .app-splash-spinner { border-color:rgba(255,255,255,.16);border-top-color:var(--splash-accent,#90caf9); } }
  </style>
  <div id="app-root"></div>
  <script>
    // Boot-phase instrumentation. Each bootMark() records ms-since-navigation into window.__bootPhases
    // (read by the boot-time test / console) AND emits a User Timing mark + a measure span from the
    // previous phase, so the phases show as flags and the deltas as bars in the DevTools Performance
    // panel's "Timings" track (no console pasting needed).
    window.__bootPhases = {};
    var __lastBootMark = null;
    function bootMark(name) {
      var t = performance.now();
      window.__bootPhases[name] = t;
      try {
        if (performance.mark) performance.mark('boot:' + name);
        if (performance.measure && __lastBootMark) {
          performance.measure('boot ' + __lastBootMark + ' \u2192 ' + name, 'boot:' + __lastBootMark, 'boot:' + name);
        }
        __lastBootMark = name;
      } catch (e) {}
    }
    bootMark('loadAppStart');

    // The app is NOT always served from the domain root: a GitHub Pages *project* site lives under
    // /<repo>/. A root-absolute asset path ('/ui.html') resolves against the domain root there, 404s,
    // and — because fetch() doesn't throw on 404 — the host's 404 PAGE gets injected as a fragment,
    // bringing its own <meta> CSP into <head>, which then blocks every later script. One bad path
    // therefore kills the whole boot. So every same-origin asset resolves through appUrl(), which
    // rewrites a leading '/' to this document's own directory. Absolute (https://…) CDN URLs are
    // passed through untouched. Exposed on window so the backends and app-core resolve identically.
    var APP_BASE = location.pathname.replace(/[^/]*$/, '');
    function appUrl(p) { return (typeof p === 'string' && p.charAt(0) === '/') ? APP_BASE + p.slice(1) : p; }
    window.appUrl = appUrl;

    // Could a local dev server plausibly be serving this origin? The dev server is plain HTTP — it binds
    // loopback by default, and even the ALLOW_INSECURE_HOST escape hatch serves http:// — so an https
    // origin is by definition a static/cloud host (GitHub Pages, Firebase Hosting) with no /api endpoint.
    // Probing there only logs a spurious "405 (Method Not Allowed)" on every single visit: the browser
    // prints a failed response to the console regardless of how the promise is handled, so try/catch
    // cannot silence it — the request simply must not be made. Loopback passes whatever the scheme, to
    // keep https-on-localhost dev setups working.
    function mayHaveLocalServer() {
      return location.protocol === 'http:' || /^(localhost|127\.0\.0\.1|\[::1\])$/i.test(location.hostname);
    }
    window.mayHaveLocalServer = mayHaveLocalServer;

    async function loadApp() {
      // /databases.js first, and on its own: everything below decides WHICH database this visit is
      // for, and that is what the module owns. It is a few hundred bytes from the same origin, so the
      // extra round trip in front of boot is cheaper than the alternative — every branch below
      // re-deriving the storage layout for itself, which is how a single `firebase_config` key ended
      // up read in thirteen places.
      await loadScript('/databases.js');
      // Fold a pre-`db.` install into the per-database layout. Idempotent, and it does NOT change
      // which database is active — see Databases.migrate.
      Databases.migrate();
      // Shared-link support: persist URL params to localStorage, then read mode.
      // shareLink generates: ?mode=firebase&k=<apiKey>&d=<authDomain>&p=<projectId>
      try {
        var qp = new URLSearchParams(location.search);
        // `?db=<key>` — how an INSTALLED app says which database it is. The manifest's start_url
        // carries it (see _updateManifest), so launching one of two installed apps lands here and
        // switches before any backend loads. A key this profile does not hold is ignored rather than
        // trusted: it names a database, it does not carry one, so the worst it could do is leave the
        // app pointing at nothing.
        var dbKey = qp.get('db');
        if (dbKey) Databases.setActive(dbKey);
        var urlMode = qp.get('mode');
        if (urlMode) {
          if (urlMode === 'supabase') {
            // Like the firebase branch: a supabase link points the app at a whole Postgres project, so
            // CONFIRM the project URL before trusting it — unless it matches one already stored.
            var sbIncoming = null;
            if (qp.get('config')) { try { sbIncoming = JSON.parse(atob(qp.get('config'))); } catch(e) {} }
            else if (qp.get('url') && qp.get('key')) { sbIncoming = { url: qp.get('url'), anonKey: qp.get('key') }; }
            if (sbIncoming && sbIncoming.url && sbIncoming.anonKey) {
              // Known if this profile holds it AT ALL, not just if it is the active one: a link to the
              // other database you already use should switch, not re-ask.
              var sbKnown = !!Databases.record(Databases.keyFor('supabase', sbIncoming));
              if (sbKnown || confirm('Connect this app to Supabase project "' + sbIncoming.url + '"?\n\nOnly continue if you recognize this project — a shared link can point the app at someone else’s database.')) {
                Databases.remember('supabase', sbIncoming);
              }
              // Declined -> nothing persisted; app_mode stays whatever it already was.
            }
          } else if (urlMode === 'firebase') {
            // A firebase config from a link points the app at a whole Firestore project. A crafted link
            // could silently connect a victim to an ATTACKER's project (their schema, their DB collecting
            // whatever the victim then enters). So parse the incoming config and CONFIRM the projectId
            // before trusting it — unless it matches a project already stored (returning user, no reprompt).
            var incoming = null;
            if (qp.get('config')) { try { incoming = JSON.parse(atob(qp.get('config'))); } catch(e) {} }
            else if (qp.get('k') && qp.get('p')) {
              // d= (authDomain) is optional: defaults to <projectId>.firebaseapp.com (the standard
              // Firebase auth domain). Only needed when a custom/non-default authDomain is used.
              incoming = { apiKey: qp.get('k'), authDomain: qp.get('d') || (qp.get('p') + '.firebaseapp.com'), projectId: qp.get('p') };
            }
            if (incoming && incoming.projectId) {
              var known = !!Databases.record(Databases.keyFor('firebase', incoming));
              if (known || confirm('Connect this app to Firebase project "' + incoming.projectId + '"?\n\nOnly continue if you recognize this project — a shared link can point the app at someone else’s database.')) {
                Databases.remember('firebase', incoming);
              }
              // Declined -> nothing persisted; app_mode stays whatever it already was (setup screen on a fresh visit).
            }
          } else {
            localStorage.setItem('app_mode', urlMode);
            if (qp.get('folder')) localStorage.setItem('app_folder', qp.get('folder'));
          }
        }
        // Strip params from the URL so a refresh doesn't re-apply / leak config. Outside the
        // `if (urlMode)` above because `?db=` arrives WITHOUT a mode — it is how an installed app
        // names itself, and it has to be cleaned up for the same reason as the rest: the choice is
        // persisted the moment it is applied, so a param left in the bar can only go stale and
        // contradict it on the next reload.
        if (urlMode || dbKey) history.replaceState(null, '', location.origin + location.pathname);
      } catch(e) {}

      var mode = localStorage.getItem('app_mode');
      var backendFile;
      if (mode === 'firebase') { backendFile = '/backend-firebase.js'; }
      else if (mode === 'supabase') { backendFile = '/backend-supabase.js'; }
      // Browser-local Postgres (PGlite in IndexedDB). Needs no server and no account, so unlike the dev
      // -server mode below there is nothing to probe for — if it is chosen, it is available.
      else if (mode === 'pglite') { backendFile = '/backend-local-pglite.js'; }
      else {
        if (mayHaveLocalServer()) {
          try {
            var probe = await fetch(appUrl('/api/validateFolder'), { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{"id":"probe"}' });
            if (probe.ok) { var pj = await probe.json(); if (pj && pj.valid) backendFile = '/backend-local-client.js'; }
          } catch(e) {}
        }
        // No stored mode and no dev server reachable: there is no backend to guess at, so boot
        // straight to the setup screen and let it choose (it stores app_mode and reloads).
      }

      // Only the MARKUP fragments (styles + Vue templates) are fetched and injected — inserting
      // markup via innerHTML never executes script. All CODE loads as real same-origin <script src>
      // elements (loadScript/loadScriptsOrdered below), so a future Content-Security-Policy needs no
      // script-src 'unsafe-inline': the old execScript() pattern injected every fragment as an
      // inline script, which a meaningful CSP forbids.
      var [styleResp, uiResp] = await Promise.all([
        fetch(appUrl('/style.html')),
        fetch(appUrl('/ui.html'))
      ]);
      bootMark('fragmentsFetched');

      // fetch() resolves on 404, so WITHOUT this check a miss would inject the host's error page —
      // including any <meta> CSP it carries — straight into <head>/#app-root. Fail loudly instead.
      if (!styleResp.ok || !uiResp.ok) {
        throw new Error('boot fragments missing: style.html ' + styleResp.status + ', ui.html ' + uiResp.status +
                        ' (resolved against ' + APP_BASE + ')');
      }

      document.head.insertAdjacentHTML('beforeend', await styleResp.text());
      document.getElementById('app-root').innerHTML = await uiResp.text();
      bootMark('fragmentsApplied');

      // Vuetify + MDI stylesheets: self-hosted from the committed /vendor assets (no external request),
      // with jsdelivr as a resilience fallback. Kick the downloads off now — they overlap the vue/vuetify
      // JS loads below — and await them just before mount so the app never flashes unstyled (FOUC).
      var stylesReady = Promise.all([
        loadStyle('/vendor/vuetify.css', 'https://cdn.jsdelivr.net/npm/vuetify@4.0.7/dist/vuetify.min.css'),
        loadStyle('/vendor/mdi.css', 'https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css')
      ]);

      // Pure domain modules for every backend (column typing, permission-features, per-list access,
      // calendar geometry + fmtDate, rotation engine, view row pipeline, embed resolution, print). They
      // don't depend on Vue/Vuetify/the SDK, so start downloading them NOW (in parallel, ordered exec)
      // and await just before the schema-loader fragment — they overlap the vue/vuetify/sdk loads for free.
      var appModulesReady = loadScriptsOrdered([
        '/columns.js', '/access-features.js', '/list-access.js', '/list-users.js', '/calendar.js',
        '/rotation.js', '/rows.js', '/events.js', '/ics.js', '/feeds.js', '/timeline.js', '/embeds.js', '/print.js', '/pivot.js', '/rsvp.js', '/form.js', '/board.js', '/stats.js',
        '/writes.js', '/migrations.js', '/schema-normalize.js', '/examples.js', '/query.js',
        '/live-sync.js'
      ]);

      // CDN fallbacks are SRI-pinned (sha384 of the exact npm-package file — jsdelivr /npm/ serves
      // tarball bytes verbatim): a compromised or tampered CDN response fails the integrity check and
      // the script simply doesn't run, instead of executing foreign code with the app's storage/tokens.
      // Update the hash whenever the pinned version changes. The gstatic/GSI SDKs below can't be
      // pinned — Google rotates those bundles in place, so an SRI hash there would break auth.
      await loadScript('/vendor/vue.js').catch(function() { return loadScript('https://cdn.jsdelivr.net/npm/vue@3.5.34/dist/vue.global.prod.js', 'sha384-o/dkigrGbFcEo9IQnKb3UkoDe43ZnvA9D531VRI1eaHuP+QiVLB7YYAxGnIEoe+t'); });
      await loadScript('/vendor/vuetify.js').catch(function() { return loadScript('https://cdn.jsdelivr.net/npm/vuetify@4.0.7/dist/vuetify.min.js', 'sha384-wnK0Mlw0rYYNIBzsFn4aOQ595f/X6hleKb5nrU00buuLaFz5ZPqbwpF4QQTjcDZh'); });
      bootMark('vueLibsLoaded');

      // Shared pure helpers. Loaded for EVERY backend: besides the store-name/schema-mirror utilities the
      // Firebase/Supabase/CRDT adapters call, app-core itself uses them (the `archiveAfter` sweep), so
      // gating this on the backend left BackendHelpers undefined on the local/Sheets paths.
      await loadScript('/backend-helpers.js');

      if (backendFile === '/backend-firebase.js') {
        await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js');
      }
      if (backendFile === '/backend-supabase.js') {
        await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
      }
      bootMark('sdkLoaded');

      // The domain modules (kicked off right after fragmentsApplied) must be executed before
      // schema-loader + app-core, which call them as globals.
      await appModulesReady;
      await loadScriptsOrdered(['/schema-loader.js', '/app-core.js']);
      await stylesReady;   // ensure Vuetify's CSS is in before first paint (no FOUC)
      createVueApp();
      bootMark('vueMounted');
      // Dev-server client helpers (_post + backend_users)
      if (backendFile === '/backend-local-client.js') {
        await loadScript('/dev-client.js');
      }
      // Load Firestore storage adapter for Firebase mode
      if (backendFile === '/backend-firebase.js') {
        await loadScript('/storage-firestore.js');
      }
      // The two key-value backends share ONE contract implementation (backend-kv.js) and differ only in
      // their storage adapter and their platform file. Load the adapter, then the shared contract — the
      // platform file loaded below reads both as globals.
      if (backendFile === '/backend-supabase.js') {
        await loadScriptsOrdered(['/storage-supabase.js', '/backend-kv.js']);
      }
      if (backendFile === '/backend-local-pglite.js') {
        await loadScriptsOrdered(['/storage-pglite.js', '/backend-kv.js']);
      }
      if (backendFile) {
        await loadScript(backendFile);
      } else {
        // Nothing configured yet — the setup dialog picks a mode, stores it, and reloads into it.
        appInstance.showSetup = true; appInstance.loading = false;
      }
      // Firebase: auth handled by onAuthStateChanged in backend-firebase.js
    }

    function loadScript(src, integrity) {
      return new Promise(function(resolve, reject) {
        var s = document.createElement('script');
        s.src = appUrl(src); s.onload = resolve; s.onerror = reject;
        if (integrity) { s.integrity = integrity; s.crossOrigin = 'anonymous'; }
        document.body.appendChild(s);
      });
    }

    // Stylesheet loader with the same /vendor-first, CDN-fallback shape as loadScript. A <link>'s
    // onerror can't live in style.html (that would be a CSP-forbidden inline handler), so the fallback
    // is wired here in JS. Resolves even when both sources fail so boot never hangs on a missing CSS —
    // the app just renders unstyled rather than blocking. jsdelivr /npm/ CSS isn't SRI-pinned (the
    // cdn-fallback CI job guards it against rot instead — see dev/test-cdn-fallback.mjs).
    function loadStyle(href, fallbackHref) {
      return new Promise(function(resolve) {
        var l = document.createElement('link');
        l.rel = 'stylesheet'; l.href = appUrl(href);
        l.onload = resolve;
        l.onerror = function() {
          if (fallbackHref) { l.onerror = resolve; l.href = appUrl(fallbackHref); }
          else resolve();
        };
        document.head.appendChild(l);
      });
    }

    // Load several same-origin scripts: download in PARALLEL, execute in the given order. async=false on
    // a dynamically-inserted script keeps insertion-order execution while allowing concurrent download —
    // ordering matters (rotation.js/rows.js capture calendar.js's fmtDate global at load time). Used to
    // fetch the pure domain modules concurrently instead of as a serial await chain.
    function loadScriptsOrdered(srcs) {
      return Promise.all(srcs.map(function(src) {
        return new Promise(function(resolve, reject) {
          var s = document.createElement('script');
          s.src = appUrl(src); s.async = false;
          s.onload = resolve; s.onerror = reject;
          document.body.appendChild(s);
        });
      }));
    }

    loadApp();

    // Register minimal service worker (enables PWA install prompt). Best-effort.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function() {});
      });
    }
  </script>
</body>
</html>
