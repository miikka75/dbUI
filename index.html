<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <!-- iOS standalone (Add to Home Screen) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div id="app-root"></div>
  <script>
    async function loadApp() {
      // Shared-link support: persist URL params to localStorage, then read mode.
      // shareLink generates: ?mode=firebase&k=<apiKey>&d=<authDomain>&p=<projectId>
      //                  or: ?mode=sheets&folder=<id>&clientId=<id>
      try {
        var qp = new URLSearchParams(location.search);
        var urlMode = qp.get('mode');
        if (urlMode) {
          localStorage.setItem('app_mode', urlMode);
          if (urlMode === 'firebase') {
            if (qp.get('config')) {
              try { localStorage.setItem('firebase_config', atob(qp.get('config'))); } catch(e) {}
            } else if (qp.get('k') && qp.get('d') && qp.get('p')) {
              localStorage.setItem('firebase_config', JSON.stringify({ apiKey: qp.get('k'), authDomain: qp.get('d'), projectId: qp.get('p') }));
            }
          } else {
            if (qp.get('folder')) localStorage.setItem('app_folder', qp.get('folder'));
            if (qp.get('clientId')) localStorage.setItem('oauth_client_id', qp.get('clientId'));
          }
          // Strip params from the URL so a refresh doesn't re-apply / leak config
          history.replaceState(null, '', location.origin + location.pathname);
        }
      } catch(e) {}

      var mode = localStorage.getItem('app_mode');
      var backendFile;
      if (mode === 'sheets') { backendFile = '/backend-oauth.html'; }
      else if (mode === 'crdt') { backendFile = '/backend-crdt.html'; }
      else if (mode === 'crdt-local') { backendFile = '/backend-crdt-local.html'; }
      else if (mode === 'firebase') { backendFile = '/backend-firebase.html'; }
      else {
        try {
          var probe = await fetch('/api/validateFolder', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{"id":"probe"}' });
          if (probe.ok) { var pj = await probe.json(); if (pj && pj.valid) backendFile = '/backend-local-client.html'; }
        } catch(e) {}
        if (!backendFile) {
          backendFile = '/backend-oauth.html';
        }
      }

      var [styleResp, uiResp, coreResp, backendResp] = await Promise.all([
        fetch('/style.html'),
        fetch('/ui.html'),
        fetch('/app-core.html'),
        fetch(backendFile)
      ]);

      document.head.insertAdjacentHTML('beforeend', await styleResp.text());
      document.getElementById('app-root').innerHTML = await uiResp.text();

      await loadScript('/vendor/vue.js').catch(function() { return loadScript('https://cdn.jsdelivr.net/npm/vue@3.5.34/dist/vue.global.prod.js'); });
      await loadScript('/vendor/vuetify.js').catch(function() { return loadScript('https://cdn.jsdelivr.net/npm/vuetify@4.0.7/dist/vuetify.min.js'); });

      // Shared pure backend helpers (used by Firebase + CRDT backends)
      if (backendFile === '/backend-firebase.html' || backendFile === '/backend-crdt.html' || backendFile === '/backend-crdt-local.html') {
        await loadScript('/backend-helpers.js');
      }

      if (backendFile === '/backend-oauth.html' || backendFile === '/backend-crdt.html') {
        await loadScript('https://accounts.google.com/gsi/client');
      }
      if (backendFile === '/backend-firebase.html') {
        await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js');
        await loadScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js');
      }

      execScript(await (await fetch('/schema-loader.html')).text());
      execScript(await coreResp.text());
      createVueApp();
      // Load shared auth before backend for OAuth/CRDT(Drive)
      if (backendFile === '/backend-oauth.html' || backendFile === '/backend-crdt.html') {
        var authResp = await fetch('/auth-oauth.html');
        execScript(await authResp.text());
        execScript(await (await fetch('/drive-helpers.html')).text());
      }
      // Dev-server client helpers (_post + backend_users) shared by local + crdt-local
      if (backendFile === '/backend-local-client.html' || backendFile === '/backend-crdt-local.html') {
        execScript(await (await fetch('/dev-client.html')).text());
      }
      // Load shared CRDT modules (engine + IDB storage + transport + unified backend)
      // for both Drive CRDT and local CRDT — they differ only in the transport.
      if (backendFile === '/backend-crdt.html' || backendFile === '/backend-crdt-local.html') {
        var transportFile = backendFile === '/backend-crdt.html' ? '/transport-drive.html' : '/transport-local.html';
        var [engineResp, storageResp, transportResp, crdtBackendResp] = await Promise.all([
          fetch('/crdt-engine.html'), fetch('/storage-idb.html'), fetch(transportFile), fetch('/crdt-backend.html')
        ]);
        execScript(await engineResp.text());
        execScript(await storageResp.text());
        execScript(await transportResp.text());
        execScript(await crdtBackendResp.text());
      }
      // Load Firestore storage adapter for Firebase mode
      if (backendFile === '/backend-firebase.html') {
        var fsResp = await fetch('/storage-firestore.html');
        execScript(await fsResp.text());
      }
      execScript(await backendResp.text());
      // For OAuth/CRDT(Drive): handle auth
      if (backendFile === '/backend-oauth.html' || backendFile === '/backend-crdt.html') {
        if (!localStorage.getItem('app_folder')) {
          appInstance.showSetup = true; appInstance.loading = false;
        } else if (sessionStorage.getItem('oauth_token')) {
          // Token cached: init directly (backend is now loaded)
          init();
        } else {
          appInstance.needsReauth = true; appInstance.loading = false;
        }
      }
      // Firebase: auth handled by onAuthStateChanged in backend-firebase.html
      if (backendFile === '/backend-firebase.html') {
        // onAuthStateChanged in backend-firebase.html handles auth state and calls init()
      }
    }

    function loadScript(src) {
      return new Promise(function(resolve, reject) {
        var s = document.createElement('script');
        s.src = src; s.onload = resolve; s.onerror = reject;
        document.body.appendChild(s);
      });
    }

    function execScript(html) {
      var match = html.match(/<script[^>]*>([\s\S]*?)<\/script>/i);
      if (match) {
        var s = document.createElement('script');
        s.textContent = match[1];
        document.body.appendChild(s);
      }
    }

    loadApp();

    // Register minimal service worker (enables PWA install prompt). Best-effort.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function() {});
      });
    }
  </script>
</body>
</html>
