<!-- backend-crdt.html — LWW CRDT backend: IndexedDB local + Drive JSON sync -->
<script>
var DB_NAME = 'dbui';
var DB_VERSION = null;
var _db = null;
var _siteId = null;
var _syncInterval = null;
var _folderId = null;

function _openDB() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open(DB_NAME);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains('_meta')) db.createObjectStore('_meta');
      if (!db.objectStoreNames.contains('_pending')) db.createObjectStore('_pending', { autoIncrement: true });
    };
    req.onsuccess = function(e) { _db = e.target.result; DB_VERSION = _db.version; resolve(_db); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}

function _ensureStore(name) {
  if (_db && _db.objectStoreNames.contains(name)) return Promise.resolve();
  if (!_db) return Promise.resolve();
  var newVersion = _db.version + 1;
  _db.close();
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open(DB_NAME, newVersion);
    req.onupgradeneeded = function(e) {
      var db = e.target.result;
      if (!db.objectStoreNames.contains(name)) db.createObjectStore(name);
    };
    req.onsuccess = function(e) { _db = e.target.result; DB_VERSION = _db.version; resolve(); };
    req.onerror = function(e) { reject(e.target.error); };
  });
}

function _idbGet(store, key) {
  if (!_db) return Promise.resolve(undefined);
  return new Promise(function(resolve, reject) {
    try {
      var tx = _db.transaction(store, 'readonly');
      var req = tx.objectStore(store).get(key);
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { resolve(undefined); };
    } catch(e) { resolve(undefined); }
  });
}

function _idbPut(store, key, value) {
  if (!_db) return Promise.resolve();
  return new Promise(function(resolve, reject) {
    try {
      var tx = _db.transaction(store, 'readwrite');
      var req = tx.objectStore(store).put(value, key);
      req.onsuccess = function() { resolve(); };
      req.onerror = function() { reject(req.error); };
    } catch(e) { resolve(); }
  });
}

function _idbDelete(store, key) {
  if (!_db) return Promise.resolve();
  return new Promise(function(resolve, reject) {
    try {
      var tx = _db.transaction(store, 'readwrite');
      var req = tx.objectStore(store).delete(key);
      req.onsuccess = function() { resolve(); };
      req.onerror = function() { resolve(); };
    } catch(e) { resolve(); }
  });
}

function _idbGetAll(store) {
  if (!_db) return Promise.resolve({ keys: [], values: [] });
  return new Promise(function(resolve, reject) {
    try {
      var tx = _db.transaction(store, 'readonly');
      var req = tx.objectStore(store).getAll();
      var keyReq = tx.objectStore(store).getAllKeys();
      var values, keys;
      req.onsuccess = function() { values = req.result; };
      keyReq.onsuccess = function() { keys = keyReq.result; };
      tx.oncomplete = function() { resolve({ keys: keys, values: values }); };
      tx.onerror = function() { resolve({ keys: [], values: [] }); };
    } catch(e) { resolve({ keys: [], values: [] }); }
  });
}

function _storeName(table, tab) { return table + '__' + (tab || 'active'); }

function _now() { return Date.now(); }

function _generateSiteId() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function _queueChange(table, tab, id, col, value, ts) {
  return _idbPut('_pending', undefined, { table: table, tab: tab || 'active', id: id, col: col, value: value, ts: ts });
}

// --- Drive helpers ---
function _getOrCreateFolder(parentId, name) {
  return _fetch('https://www.googleapis.com/drive/v3/files?q=\'' + parentId + '\' in parents and name=\'' + name + '\' and mimeType=\'application/vnd.google-apps.folder\' and trashed=false&fields=files(id)')
    .then(function(r) { return r.json(); }).then(function(d) {
      if (d.files && d.files.length) return d.files[0].id;
      return _fetch('https://www.googleapis.com/drive/v3/files', 'POST', { name: name, mimeType: 'application/vnd.google-apps.folder', parents: [parentId] })
        .then(function(r) { return r.json(); }).then(function(f) { return f.id; });
    });
}

function _uploadFile(folderId, name, content) {
  return _fetch('https://www.googleapis.com/drive/v3/files?q=\'' + folderId + '\' in parents and name=\'' + name + '\' and trashed=false&fields=files(id)')
    .then(function(r) { return r.json(); }).then(function(d) {
      var fileId = d.files && d.files[0] ? d.files[0].id : null;
      var metadata = { name: name }; if (!fileId) metadata.parents = [folderId];
      var form = new FormData();
      form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
      form.append('file', new Blob([content], { type: 'application/json' }));
      var url = fileId
        ? 'https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=multipart'
        : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
      return fetch(url, { method: fileId ? 'PATCH' : 'POST', headers: { Authorization: 'Bearer ' + _token }, body: form });
    });
}

function _downloadFile(fileId) {
  return _fetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media').then(function(r) { return r.text(); });
}

// --- Sync engine ---
function _pushChanges() {
  return _idbGetAll('_pending').then(function(result) {
    if (!result.values.length) return;
    // Group changes by table
    var byTable = {};
    result.values.forEach(function(c) {
      if (!byTable[c.table]) byTable[c.table] = [];
      byTable[c.table].push(c);
    });
    return _getOrCreateFolder(_folderId, 'sync').then(function(syncId) {
      var tables = Object.keys(byTable);
      return tables.reduce(function(chain, table) {
        return chain.then(function() {
          return _getOrCreateFolder(syncId, table).then(function(tableFolderId) {
            // Download existing file, append + dedup
            return _fetch('https://www.googleapis.com/drive/v3/files?q=\'' + tableFolderId + '\' in parents and name=\'' + _siteId + '.json\' and trashed=false&fields=files(id)')
              .then(function(r) { return r.json(); }).then(function(d) {
                var existing = { siteId: _siteId, changes: [] };
                if (d.files && d.files.length) {
                  return _downloadFile(d.files[0].id).then(function(t) { try { existing = JSON.parse(t); } catch(e) {} return existing; });
                }
                return existing;
              }).then(function(existing) {
                existing.changes = existing.changes.concat(byTable[table]);
                // Dedup: keep latest per (tab, id, col)
                var seen = {};
                for (var i = existing.changes.length - 1; i >= 0; i--) {
                  var c = existing.changes[i];
                  var key = c.tab + '|' + c.id + '|' + c.col;
                  if (seen[key]) { existing.changes.splice(i, 1); } else { seen[key] = true; }
                }
                // Compact: group by (tab, id) into {t, b, id, ts, d:{col:val}}
                var groups = {};
                existing.changes.forEach(function(c) {
                  var gk = c.tab + '|' + c.id;
                  if (!groups[gk]) groups[gk] = { t: table, b: c.tab, id: c.id, ts: c.ts, d: {} };
                  groups[gk].d[c.col] = c.value;
                  if (c.ts > groups[gk].ts) groups[gk].ts = c.ts;
                });
                existing.changes = Object.keys(groups).map(function(k) { return groups[k]; });
                return _uploadFile(tableFolderId, _siteId + '.json', JSON.stringify(existing));
              });
          });
        });
      }, Promise.resolve());
    }).then(function() {
      if (!_db) return;
      var tx = _db.transaction('_pending', 'readwrite');
      tx.objectStore('_pending').clear();
      return new Promise(function(resolve) { tx.oncomplete = resolve; });
    });
  });
}

function _pullChanges() {
  return _getOrCreateFolder(_folderId, 'sync').then(function(syncId) {
    // List table subfolders
    return _fetch('https://www.googleapis.com/drive/v3/files?q=\'' + syncId + '\' in parents and mimeType=\'application/vnd.google-apps.folder\' and trashed=false&fields=files(id,name)')
      .then(function(r) { return r.json(); });
  }).then(function(d) {
    var folders = d.files || [];
    return folders.reduce(function(chain, folder) {
      return chain.then(function() {
        // List sync files from other devices in this table folder
        return _fetch('https://www.googleapis.com/drive/v3/files?q=\'' + folder.id + '\' in parents and trashed=false&fields=files(id,name)')
          .then(function(r) { return r.json(); }).then(function(fd) {
            var files = (fd.files || []).filter(function(f) { return f.name !== _siteId + '.json'; });
            return files.reduce(function(fChain, f) {
              return fChain.then(function() {
                return _downloadFile(f.id).then(function(text) {
                  try { var data = JSON.parse(text); return _mergeChanges(data.changes || []); } catch(e) { return; }
                });
              });
            }, Promise.resolve());
          });
      });
    }, Promise.resolve());
  });
}

function _mergeChanges(changes) {
  var expanded = [];
  changes.forEach(function(c) {
    Object.keys(c.d).forEach(function(col) {
      expanded.push({ table: c.t, tab: c.b, id: c.id, col: col, value: c.d[col], ts: c.ts });
    });
  });
  return expanded.reduce(function(chain, c) {
    return chain.then(function() {
      var store = _storeName(c.table, c.tab);
      return _ensureStore(store).then(function() {
        return _idbGet(store, c.id);
      }).then(function(row) {
        if (c.col === null) {
          // Delete: only apply if ts is newer than all existing cell timestamps
          if (!row) return;
          var maxTs = Object.keys(row._ts || {}).reduce(function(m, k) { return Math.max(m, row._ts[k]); }, 0);
          if (c.ts > maxTs) return _idbDelete(store, c.id);
        } else {
          row = row || { id: c.id, _ts: {} };
          row._ts = row._ts || {};
          if (!row._ts[c.col] || c.ts > row._ts[c.col]) {
            row[c.col] = c.value;
            row._ts[c.col] = c.ts;
            return _idbPut(store, c.id, row);
          }
        }
      });
    });
  }, Promise.resolve());
}

function startSync(folderId, intervalMs) {
  _folderId = folderId;
  if (_syncInterval) clearInterval(_syncInterval);
  _syncInterval = setInterval(function() { _pushChanges().then(_pullChanges); }, intervalMs || 30000);
  return _pushChanges().then(_pullChanges);
}

// --- Backend interface ---
backend = {
  getSchema: function(folderId) {
    return _idbGet('_meta', 'schema').then(function(cached) {
      if (cached) return cached;
      return _fetch('https://www.googleapis.com/drive/v3/files?q=\'' + folderId + '\' in parents and name=\'schema.json\' and trashed=false&fields=files(id)')
        .then(function(r) { return r.json(); }).then(function(d) {
          if (!d.files || !d.files.length) return null;
          return _downloadFile(d.files[0].id).then(function(t) {
            var schema = JSON.parse(t);
            _idbPut('_meta', 'schema', schema);
            return schema;
          });
        });
    });
  },
  saveSchema: function(folderId, schema) {
    return _idbPut('_meta', 'schema', schema).then(function() {
      return _uploadFile(folderId, 'schema.json', JSON.stringify(schema, null, 2));
    });
  },
  validateFolder: function(id) {
    return _fetch('https://www.googleapis.com/drive/v3/files/' + id + '?fields=name').then(function(res) {
      if (res.ok) return res.json().then(function(d) { return { valid: true, name: d.name }; });
      return { valid: false, name: null };
    });
  },
  getFolderConfig: function(folderId) {
    return _fetch('https://www.googleapis.com/drive/v3/files?q=\'' + folderId + '\' in parents and name=\'.app-config.json\' and trashed=false&fields=files(id)')
      .then(function(r) { return r.json(); }).then(function(d) {
        if (!d.files || !d.files.length) return null;
        return _downloadFile(d.files[0].id).then(function(t) { return JSON.parse(t); });
      });
  },
  setFolderConfig: function(folderId, config) {
    return _uploadFile(folderId, '.app-config.json', JSON.stringify(config));
  },
  initSchema: function(folderId, schema) {
    _folderId = folderId;
    var result = {};
    var tables = Object.keys(schema);
    // Collect all needed store names
    var needed = [];
    tables.forEach(function(table) {
      var def = schema[table];
      var tab = (def && def.partition) || 'active';
      needed.push(_storeName(table, tab));
      if (def && def.archivePartition) needed.push(_storeName(table, def.archivePartition));
      result[table] = table;
    });
    // Find which stores are missing
    var missing = needed.filter(function(n) { return !_db || !_db.objectStoreNames.contains(n); });
    if (!missing.length) { startSync(folderId, 30000); return Promise.resolve(result); }
    // Create all missing in one upgrade
    var newVersion = (_db ? _db.version : 0) + 1;
    if (_db) _db.close();
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open(DB_NAME, newVersion);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        missing.forEach(function(n) { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n); });
      };
      req.onsuccess = function(e) { _db = e.target.result; DB_VERSION = _db.version; startSync(folderId, 30000); resolve(result); };
      req.onerror = function(e) { reject(e.target.error); };
    });
  },
  bootData: function(folderId, schema) {
    _folderId = folderId;
    var self = this;
    return this.getSchema(folderId).then(function(s) {
      var parsed = s || schema;
      var tables = parsed && parsed.tables ? parsed.tables : (parsed || {});
      return self.initSchema(folderId, tables).then(function(tableMap) {
        return self.getLists(folderId).then(function(lists) {
          return self.getAvailableLanguages(folderId).then(function(languages) {
            // Load all table data
            var data = {};
            var chain = Promise.resolve();
            Object.keys(tableMap).forEach(function(name) {
              var def = tables[name];
              chain = chain.then(function() {
                return self.getTableData(name, (def && def.partition) || 'active').then(function(r) { data[name] = r; });
              }).then(function() {
                if (def && def.archivePartition) return self.getTableData(name, def.archivePartition).then(function(r) { data[name + '__archive'] = r; });
              });
            });
            return chain.then(function() {
              return { schema: parsed, tableMap: tableMap, languages: languages, lists: lists, data: data };
            });
          });
        });
      });
    });
  },
  getAvailableTables: function() { return Promise.resolve([]); },
  getAvailableLanguages: function(folderId) {
    return _idbGet('_meta', 'languages').then(function(l) { return l || []; });
  },
  getTableData: function(tableId, tab) {
    var store = _storeName(tableId, tab);
    return _ensureStore(store).then(function() { return _idbGetAll(store); }).then(function(result) {
      var rows = result.values.map(function(row) {
        var clean = {}; Object.keys(row).forEach(function(k) { if (k !== '_ts') clean[k] = row[k]; });
        return clean;
      });
      var headers = rows.length ? Object.keys(rows[0]) : [];
      return { headers: headers, rows: rows };
    });
  },
  putRow: function(tableId, data, tab) {
    var store = _storeName(tableId, tab);
    var ts = _now();
    if (!data.id) data.id = _generateSiteId();
    return _ensureStore(store).then(function() { return _idbGet(store, data.id); }).then(function(existing) {
      var row = existing || { id: data.id, _ts: {} };
      row._ts = row._ts || {};
      var changed = [];
      Object.keys(data).forEach(function(k) {
        if (row[k] !== data[k]) { changed.push(k); row[k] = data[k]; row._ts[k] = ts; }
      });
      if (!existing) changed = Object.keys(data); // new row = all columns
      return _idbPut(store, data.id, row).then(function() { return changed; });
    }).then(function(changed) {
      if (!changed.length) return;
      var promises = changed.map(function(col) {
        return _queueChange(tableId, tab || 'active', data.id, col, data[col], ts);
      });
      return Promise.all(promises);
    });
  },
  deleteRow: function(tableId, id, tab) {
    var store = _storeName(tableId, tab);
    var ts = _now();
    return _ensureStore(store).then(function() { return _idbDelete(store, id); }).then(function() {
      return _queueChange(tableId, tab || 'active', id, null, null, ts);
    });
  },
  moveRow: function(tableId, rowData, fromTab, toTab) {
    var self = this;
    return self.deleteRow(tableId, rowData.id, fromTab).then(function() {
      return self.putRow(tableId, rowData, toTab);
    });
  },
  getLists: function(folderId) {
    return _idbGet('_meta', 'lists').then(function(l) { return l || {}; });
  },
  saveLists: function(folderId, lists) {
    return _idbPut('_meta', 'lists', lists).then(function() {
      return _uploadFile(folderId, 'lists.json', JSON.stringify(lists));
    });
  },
  putListItem: function(folderId, listName, value) {
    return _idbGet('_meta', 'lists').then(function(lists) {
      lists = lists || {};
      lists[listName] = lists[listName] || [];
      if (lists[listName].indexOf(value) === -1) lists[listName].push(value);
      return _idbPut('_meta', 'lists', lists);
    });
  },
  getTranslations: function(folderId, langCode) {
    return _idbGet('_meta', 'lang_' + langCode).then(function(t) { return t || {}; });
  },
  updateTranslations: function(folderId, langCode, updates) {
    return _idbGet('_meta', 'lang_' + langCode).then(function(t) {
      t = t || {};
      Object.keys(updates).forEach(function(k) { t[k] = updates[k]; });
      return _idbPut('_meta', 'lang_' + langCode, t);
    });
  },
  createLanguage: function(folderId, code, name, keys) {
    return _idbGet('_meta', 'languages').then(function(langs) {
      langs = langs || [];
      langs.push({ code: code, name: name });
      return _idbPut('_meta', 'languages', langs);
    }).then(function() {
      var t = {}; if (keys) keys.forEach(function(k) { t[k] = ''; });
      return _idbPut('_meta', 'lang_' + code, t);
    });
  },
  deleteLanguage: function(folderId, code) {
    return _idbGet('_meta', 'languages').then(function(langs) {
      langs = (langs || []).filter(function(l) { return l.code !== code; });
      return _idbPut('_meta', 'languages', langs);
    }).then(function() { return _idbDelete('_meta', 'lang_' + code); });
  },
  saveChangesets: function(folderId, siteId, json) { return _pushChanges(); },
  loadChangesets: function(folderId, excludeSiteId) { return _pullChanges(); }
};

// --- Init ---
_openDB().then(function() {
  return _idbGet('_meta', 'siteId').then(function(id) {
    if (id) { _siteId = id; return; }
    _siteId = _generateSiteId();
    return _idbPut('_meta', 'siteId', _siteId);
  });
});
</script>
