<!-- crdt-engine.html -- Storage-agnostic CRDT sync engine (LWW per field)
     Requires: a storage adapter object with get/put/delete/getAll/getMeta/setMeta methods
     and a transport object with pushChangesets/pullChangesets methods.
     Include this BEFORE the storage adapter and transport scripts. -->
<script>
var CrdtEngine = (function() {
  var _storage = null;
  var _transport = null;
  var _siteId = null;
  var _syncInterval = null;

  function _now() { return Date.now(); }
  function _generateId() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }
  function _storeName(table, tab) { return BackendHelpers.storeName(table, tab); }

  function init(storage, transport) {
    _storage = storage;
    _transport = transport;
    return _storage.getMeta('siteId').then(function(id) {
      if (id) { _siteId = id; return; }
      _siteId = _generateId();
      return _storage.setMeta('siteId', _siteId);
    });
  }

  function startSync(intervalMs) {
    if (_syncInterval) clearInterval(_syncInterval);
    _syncInterval = setInterval(function() { pushChanges().then(pullChanges); }, intervalMs || 30000);
    return pushChanges().then(pullChanges);
  }

  function stopSync() { if (_syncInterval) { clearInterval(_syncInterval); _syncInterval = null; } }

  function pushChanges() {
    return _storage.getPending().then(function(pending) {
      if (!pending.length) return;
      // Group by table, compact to {t, b, id, ts, d:{col:val}}
      var groups = {};
      pending.forEach(function(c) {
        var gk = c.table + '|' + c.tab + '|' + c.id;
        if (!groups[gk]) groups[gk] = { t: c.table, b: c.tab, id: c.id, ts: c.ts, d: {} };
        groups[gk].d[c.col] = c.value;
        if (c.ts > groups[gk].ts) groups[gk].ts = c.ts;
      });
      var changes = Object.keys(groups).map(function(k) { return groups[k]; });
      return _transport.pushChangesets(_siteId, changes).then(function() {
        return _storage.clearPending();
      });
    });
  }

  function pullChanges() {
    return _transport.pullChangesets(_siteId).then(function(remoteData) {
      if (!remoteData || !remoteData.length) return;
      // remoteData = array of { siteId, changes: [...] }
      var allChanges = [];
      remoteData.forEach(function(r) {
        var changes = r.changes || [];
        // Handle both compact {t,b,id,ts,d} and expanded {table,tab,id,col,value,ts}
        changes.forEach(function(c) {
          if (c.d) {
            Object.keys(c.d).forEach(function(col) {
              allChanges.push({ table: c.t, tab: c.b, id: c.id, col: col, value: c.d[col], ts: c.ts });
            });
          } else {
            allChanges.push(c);
          }
        });
      });
      return mergeChanges(allChanges);
    });
  }

  function mergeChanges(changes) {
    return changes.reduce(function(chain, c) {
      return chain.then(function() {
        var store = _storeName(c.table, c.tab);
        return _storage.ensureStore(store).then(function() {
          return _storage.get(store, c.id);
        }).then(function(row) {
          if (c.col === null) {
            // Delete -> write a tombstone (kept so stale writes can't resurrect the row)
            var maxTs = row && row._ts ? Object.keys(row._ts).reduce(function(m, k) { return Math.max(m, row._ts[k]); }, 0) : 0;
            if (!row || c.ts > maxTs) {
              return _storage.put(store, c.id, { id: c.id, _deleted: true, _ts: { _deleted: c.ts } });
            }
          } else {
            row = row || { id: c.id, _ts: {} };
            row._ts = row._ts || {};
            // Reject writes older than a tombstone (no resurrection of deleted rows)
            if (row._deleted && c.ts <= (row._ts._deleted || 0)) return;
            if (!row._ts[c.col] || c.ts > row._ts[c.col]) {
              if (row._deleted) { delete row._deleted; delete row._ts._deleted; }
              row[c.col] = c.value;
              row._ts[c.col] = c.ts;
              return _storage.put(store, c.id, row);
            }
          }
        });
      });
    }, Promise.resolve());
  }

  // --- Public backend interface (same shape as other backends) ---
  function getTableData(tableId, tab) {
    var store = _storeName(tableId, tab);
    return _storage.ensureStore(store).then(function() { return _storage.getAll(store); }).then(function(rows) {
      var clean = rows.filter(function(row) { return !row._deleted; }).map(function(row) {
        var r = {}; Object.keys(row).forEach(function(k) { if (k !== '_ts' && k !== '_deleted') r[k] = row[k]; }); return r;
      });
      var headers = clean.length ? Object.keys(clean[0]) : [];
      return { headers: headers, rows: clean };
    });
  }

  function putRow(tableId, data, tab) {
    var store = _storeName(tableId, tab);
    var ts = _now();
    if (!data.id) data.id = _generateId();
    return _storage.ensureStore(store).then(function() { return _storage.get(store, data.id); }).then(function(existing) {
      var row = existing || { id: data.id, _ts: {} };
      row._ts = row._ts || {};
      var wasTombstone = !!row._deleted;
      if (wasTombstone) { delete row._deleted; delete row._ts._deleted; }
      var changed = [];
      Object.keys(data).forEach(function(k) {
        if (row[k] !== data[k]) { changed.push(k); row[k] = data[k]; row._ts[k] = ts; }
      });
      if (!existing || wasTombstone) changed = Object.keys(data);
      return _storage.put(store, data.id, row).then(function() { return changed; });
    }).then(function(changed) {
      if (!changed.length) return;
      return Promise.all(changed.map(function(col) {
        return _storage.addPending({ table: tableId, tab: tab || 'active', id: data.id, col: col, value: data[col], ts: ts });
      }));
    });
  }

  function deleteRow(tableId, id, tab) {
    var store = _storeName(tableId, tab);
    var ts = _now();
    return _storage.ensureStore(store).then(function() {
      // Write a tombstone (not a hard delete) so the deletion propagates and survives stale writes
      return _storage.put(store, id, { id: id, _deleted: true, _ts: { _deleted: ts } });
    }).then(function() {
      return _storage.addPending({ table: tableId, tab: tab || 'active', id: id, col: null, value: null, ts: ts });
    });
  }

  function moveRow(tableId, rowData, fromTab, toTab) {
    return deleteRow(tableId, rowData.id, fromTab).then(function() {
      return putRow(tableId, rowData, toTab);
    });
  }

  return {
    init: init,
    startSync: startSync,
    stopSync: stopSync,
    pushChanges: pushChanges,
    pullChanges: pullChanges,
    getTableData: getTableData,
    putRow: putRow,
    deleteRow: deleteRow,
    moveRow: moveRow,
    getSiteId: function() { return _siteId; }
  };
})();
</script>
