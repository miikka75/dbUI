<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Chores">
  <!-- Favicon for the chores example schema (examples/chores-schema.json -> "icon").
       Drawn rather than an emoji: an emoji favicon is rendered by whatever font the OS happens to
       have, so the same schema looks different on every platform, and the apple-touch path
       rasterizes it through canvas, where a missing glyph produces a blank tile.
       Teal is the chores palette's `primary` (#00695c light / #4db6ac dark), so the tab icon and the
       app agree. A clipboard with a tick reads at 16px, which a broom does not. -->
  <rect width="32" height="32" rx="7" fill="#00695c"/>
  <!-- clipboard body -->
  <rect x="8" y="7" width="16" height="19" rx="2.5" fill="#ffffff"/>
  <!-- clip at the top -->
  <rect x="12.5" y="4.5" width="7" height="4.5" rx="1.6" fill="#b2dfdb"/>
  <rect x="12.5" y="4.5" width="7" height="4.5" rx="1.6" fill="none" stroke="#00695c" stroke-width="1.2"/>
  <!-- tick: the chore is done -->
  <path d="M11.5 16.8 l3.2 3.2 l6.2 -6.6" fill="none" stroke="#00695c"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
