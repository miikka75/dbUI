<!-- transport-local.html -- Local server transport for CrdtEngine sync + file I/O -->
<script>
var TransportLocal = (function() {
  function pushChangesets(siteId, changes) {
    return _post('saveChangesets', { siteId: siteId, json: JSON.stringify({ siteId: siteId, changes: changes }) });
  }
  function pullChangesets(excludeSiteId) {
    return _post('loadChangesets', { excludeSiteId: excludeSiteId }).then(function(results) {
      return (results || []).map(function(r) {
        try { return JSON.parse(r.data); } catch(e) { return null; }
      }).filter(Boolean);
    });
  }
  return {
    validateFolder: function(id) { return _post('validateFolder', { id: id }); },
    readJson: function(name) { return _post('readFile', { name: name }).then(function(r) { return r.data; }); },
    writeJson: function(name, data) { return _post('writeFile', { name: name, data: data }); },
    deleteFile: function(name) { return _post('deleteFile', { name: name }); },
    pushChangesets: pushChangesets,
    pullChangesets: pullChangesets
  };
})();
</script>
