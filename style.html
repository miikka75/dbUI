<!-- Vuetify + MDI stylesheets are loaded by index.html's boot loader (loadStyle): /vendor first,
     jsdelivr as an SRI-free resilience fallback — mirroring how vue.js/vuetify.js load. They live
     there rather than as <link> tags here so the CDN fallback can run without a CSP-forbidden inline
     onerror handler, and so the app self-hosts with no external request when /vendor is present. -->
<style>
[v-cloak] { display: none !important; }
html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1a; }
.v-table__wrapper { max-height: calc(100vh - 200px); overflow-y: auto !important; }
.v-navigation-drawer .v-list-item--active { background: rgb(var(--v-theme-primary), 0.08); }
/* Normalize nav icons: top-level 24px (drawer + tabs), sub-views 18px (rule below wins by source order) */
.v-navigation-drawer .v-list-item__prepend .v-icon { font-size: 24px; }
.v-tabs .v-tab .v-icon { font-size: 24px; }
.subview-item .v-list-item__prepend .v-icon { font-size: 18px; }
/* Nav tabs: drop the active-tab underline slider; use a background tint as the active indicator instead */
.nav-tabs .v-tab__slider { display: none; }
.nav-tabs .v-tab .v-btn__overlay { opacity: 0 !important; }  /* drive the tab bg ourselves so the icon and the hover-overlay label always match */
.nav-tabs .v-tab { transition: background 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
.nav-tabs .v-tab[aria-selected="true"], .nav-tabs .v-tab.nav-tab-active { background: rgba(var(--v-theme-primary), 0.18); }
.nav-tabs .v-tab:hover { background: rgba(var(--v-theme-on-surface), var(--v-hover-opacity)); }
.nav-tabs .v-tab[aria-selected="true"]:hover, .nav-tabs .v-tab.nav-tab-active:hover { background: linear-gradient(rgba(var(--v-theme-on-surface), var(--v-hover-opacity)), rgba(var(--v-theme-on-surface), var(--v-hover-opacity))), rgba(var(--v-theme-primary), 0.18); }
.subview-item { padding-inline-start: 16px !important; }
/* Icon-only tabs (hamburger toggles rail): label hidden; on hover it overlays in place
   (right after the icon, like a full-size tab) -- inherits the tab's font/color, no width change */
.nav-icons-only .v-tab { position: relative; }
.nav-icons-only .v-tab .tab-label {
  display: flex; align-items: center;
  position: absolute; left: 100%; top: 0; height: 100%;
  padding: 0 12px; white-space: nowrap; z-index: 5;
  pointer-events: none;            /* overlay blocks the view but never the pointer -> hover follows the icon under the cursor */
  opacity: 0; transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);  /* fade in like the icon's hover tint */
  /* match the hovered icon area: tab surface + Vuetify's hover tint (theme-aware) */
  background: linear-gradient(rgba(var(--v-theme-on-surface), var(--v-hover-opacity)), rgba(var(--v-theme-on-surface), var(--v-hover-opacity))), rgb(var(--v-theme-surface));
}
.nav-icons-only .v-tab:hover .tab-label { opacity: 1; }
.nav-icons-only .v-tab[aria-selected="true"] .tab-label, .nav-icons-only .v-tab.nav-tab-active .tab-label {
  /* active tab also carries the primary active tint, beneath the hover tint (match icon layer order) */
  background: linear-gradient(rgba(var(--v-theme-on-surface), var(--v-hover-opacity)), rgba(var(--v-theme-on-surface), var(--v-hover-opacity))), linear-gradient(rgba(var(--v-theme-primary), 0.18), rgba(var(--v-theme-primary), 0.18)), rgb(var(--v-theme-surface));
}
/* Setup mode buttons: left-align icon+text so all icons/titles line up, allow 2-line content */
.mode-btn .v-btn__content { justify-content: flex-start; width: 100%; white-space: normal; }
.mode-btn .v-btn__content > div { min-width: 0; flex: 1 1 auto; overflow-wrap: anywhere; }
.mode-btn { height: auto !important; padding-top: 10px; padding-bottom: 10px; }
.editable-cell { min-width: 120px; min-height: 32px; outline: none; padding: 6px 10px; border-radius: 4px; border: 1px solid rgb(var(--v-theme-outline), 0.3); display: inline-block; width: 100%; box-sizing: border-box; }
/* Focus fill: a subtle on-surface state layer (adapts per theme, stays clear of the text color) rather
   than the fixed dark `surface-variant` — which read too dark in light mode / too bright in dark mode. */
.editable-cell:focus { background: rgba(var(--v-theme-on-surface), var(--v-focus-opacity)); border-color: rgb(var(--v-theme-primary)); outline: none; }
/* user avatar: the initial shown when someone has a name but no uploaded picture */
.user-avatar__initial { font-weight: 600; line-height: 1; text-transform: uppercase; }
/* list value + optional linked-user avatar (the shared <list-value> renderer). Inline-flex so it flows in
   cells/labels like text, wrapping multiselect entries without splitting an avatar from its name. */
.list-value { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px 5px; vertical-align: middle; }
.list-value__item { display: inline-flex; align-items: center; gap: 4px; }
/* user-ref: avatar + display name chip for email-keyed people (rsvp roster) */
.user-ref { display: inline-flex; align-items: center; gap: 4px; vertical-align: middle; }
/* rsvp roster: each person is an inline avatar + name chip; groups wrap without splitting a person */
.rsvp-roster-group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.rsvp-person { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
/* background-position picker (Settings -> Backgrounds): a 3x3 grid standing in for the nine keyword
   positions. Every cell carries a resting fill so the grid reads as a control — an outline-only cell was
   effectively invisible, leaving just the selected square visible and nothing to suggest it was clickable. */
.bg-pos-grid { display: inline-flex; flex-direction: column; gap: 3px; padding: 3px; border-radius: 5px; background: rgb(var(--v-theme-on-surface), 0.05); }
.bg-pos-cell { width: 15px; height: 15px; border-radius: 3px; cursor: pointer; background: rgb(var(--v-theme-on-surface), 0.16); transition: background 0.15s; }
.bg-pos-cell:hover { background: rgb(var(--v-theme-on-surface), 0.34); }
.bg-pos-cell--on, .bg-pos-cell--on:hover { background: rgb(var(--v-theme-primary)); }
/* image-column thumbnail (data-cell): fixed-height preview that links to the full image */
.cell-thumb { height: 36px; max-width: 96px; object-fit: cover; border-radius: 4px; border: 1px solid rgb(var(--v-theme-outline), 0.3); display: block; }
td { vertical-align: middle; padding: 4px 8px !important; }
/* A table at width:100% hands its SURPLUS width to every column in proportion to that column's own
   max-content width — so a column with nothing in it still claimed its cut, and claimed the same
   percentage no matter how narrow the window got. An explicit tiny width opts a column out of that
   share-out: it settles at its own min-content (its header) and the surplus goes to the columns that
   have something to show. Marked per render by `emptyCols`, so a column widens again the moment it
   holds a value; dropping such a column entirely stays the separate, opt-in `hideEmpty`.
   The row-button column opts out the same way and always: it holds fixed-size icons, so any share of the
   surplus it took was padding. It also has to opt out for the all-columns-empty case (a fresh table with
   one blank row) — as the only column still absorbing, it would otherwise take ALL the spare width and
   push every field into a huddle on the left. */
.v-table th.col-empty, .v-table td.col-empty, .v-table th.col-actions, .v-table td.col-actions { width: 1%; }
/* Once a column is down to min-content, its floor is its own HEADER: one long word (a Finnish compound
   like "Musiikkiesitys") holds a column open by itself with nothing under it. So an empty column's header
   may clip. Truncation beats the alternatives here — letting it wrap mid-word costs three header lines and
   reads as broken, and the name matters least on the column that has nothing in it. The full name stays on
   hover (th `title`), and the column returns to its natural width the moment it holds a value. */
.v-table th.col-empty { max-width: 6em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
input[type="date"] { border: 1px solid rgb(var(--v-theme-outline), 0.3); border-radius: 4px; padding: 6px 10px; min-height: 32px; background: transparent; color: inherit; font: inherit; }
input[type="date"]:focus { outline: none; border-color: rgb(var(--v-theme-primary)); }
/* Standalone "overline" label, kept for controls that pair a caption with something that is not a field
   (the Settings background position grid and opacity slider). The row-card layouts that used to pair it
   with a value now use .field-box instead. */
.card-field-label { display: block; font-size: 0.6rem; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.55; line-height: 1.5; }
@media (min-width: 600px) {
  .card-field-label { min-width: 110px; padding-right: 8px; font-size: 0.75rem; letter-spacing: normal; text-transform: none; opacity: 0.6; }
}
/* Board (kanban) lanes: fixed-width columns that scroll horizontally on desktop; on mobile they stack
   full-width so a phase row never needs a horizontal scrollbar (the page scrolls vertically instead).
   Collapsible phase headers (laneGroups) stay the mechanism for taming a long lifecycle. */
.board-lane-row { display: flex; gap: 10px; overflow-x: auto; padding: 8px; align-items: flex-start; }
.board-lane { flex: 0 0 240px; min-width: 240px; border-radius: 8px; padding: 6px; background: rgb(var(--v-theme-on-surface), 0.04); box-sizing: border-box; }
@media (max-width: 599.98px) {
  .board-lane-row { flex-direction: column; overflow-x: visible; }
  .board-lane { flex: 1 1 auto; min-width: 0; width: 100%; }
}
/* One row's field, shared by the kanban card and the card layout: a real <v-field variant="outlined">, so
   the notched outline and the floated top-left label come from Vuetify itself and match Settings -> Profile
   exactly. Only spacing and the nested editor need styling here — the notch sizes itself off the label, so
   capping the label's width here would shrink the notch it is measured against and truncate a name that
   had room.
   Density comes from `.v-input--density-*` ANCESTOR selectors, so a bare v-field (no v-input around it)
   inherits none of it and silently runs on the default 56px height and 16px bottom padding — which is what
   left a wide gap between a value and the line under it. The scale is therefore set here outright. The
   floated label needs no size of its own — it is 0.75em, so it follows this font-size down. */
.field-box.v-field {
  --v-input-control-height: 30px;
  --v-field-padding-top: 2px; --v-field-padding-bottom: 2px;
  --v-field-padding-start: 10px; --v-field-padding-end: 10px;
  font-size: 0.8rem; margin-top: 6px;
}
/* The card layout runs a size up from the kanban's: it is a full-width primary reading surface, not a
   240px lane, and its rows are what the screen is for. Same control, one step roomier. */
.field-box--roomy.v-field { --v-input-control-height: 38px; --v-field-padding-start: 12px; --v-field-padding-end: 12px; font-size: 0.875rem; margin-top: 8px; }
.field-box-value { min-width: 0; overflow-wrap: anywhere; }
/* The outer field supplies the frame, so a data-cell editor NESTED inside it drops its own resting
   padding and min-height — a compact v-field's 40px floor applied twice would double every card's
   height. Scoped through a second `.v-field` so these never hit the outer field's own parts. */
.field-box .v-field .v-field__input { padding: 0; min-height: 0; }
/* v-input and v-field each hard-set their own size, so a list/ref editor would sit at full size inside a
   shrunken card field while a plain text column (a contenteditable, which inherits) came out small — the
   same card showing two type sizes. Both are re-pointed at the card's scale, and the native <input> with
   them (url/date columns): an input does not inherit type from its parent on its own. */
.field-box .v-input, .field-box .v-field, .field-box input { font-size: inherit; }
.field-box .v-field .v-field__append-inner, .field-box .v-field .v-field__prepend-inner { padding-top: 0; align-items: center; }
.field-box .editable-cell { border: none; border-radius: 0; padding: 0; min-width: 0; min-height: 0; }
.field-box .editable-cell:focus { background: transparent; }
.field-box input[type="date"] { border: none; padding: 0; min-height: 0; }
</style>
