<!-- storage-idb.html -- IndexedDB storage adapter for CrdtEngine -->
<script>
var StorageIDB = (function() {
  var DB_NAME = 'dbui';
  var _db = null;

  function open() {
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open(DB_NAME);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        if (!db.objectStoreNames.contains('_meta')) db.createObjectStore('_meta');
        if (!db.objectStoreNames.contains('_pending')) db.createObjectStore('_pending', { autoIncrement: true });
      };
      req.onsuccess = function(e) { _db = e.target.result; resolve(); };
      req.onerror = function(e) { reject(e.target.error); };
    });
  }

  function ensureStore(name) {
    return ensureStores([name]);
  }

  // Create all missing stores in a SINGLE version upgrade (avoids the multi-upgrade
  // close/reopen race that lost writes on first import).
  function ensureStores(names) {
    if (!_db) return Promise.resolve();
    var missing = names.filter(function(n) { return !_db.objectStoreNames.contains(n); });
    if (!missing.length) return Promise.resolve();
    var newVersion = _db.version + 1;
    _db.close();
    return new Promise(function(resolve, reject) {
      var req = indexedDB.open(DB_NAME, newVersion);
      req.onupgradeneeded = function(e) {
        var db = e.target.result;
        missing.forEach(function(n) { if (!db.objectStoreNames.contains(n)) db.createObjectStore(n); });
      };
      req.onsuccess = function(e) { _db = e.target.result; resolve(); };
      req.onerror = function(e) { reject(e.target.error); };
    });
  }

  function get(store, key) {
    if (!_db) return Promise.resolve(undefined);
    return new Promise(function(resolve) {
      try {
        var tx = _db.transaction(store, 'readonly');
        var req = tx.objectStore(store).get(key);
        req.onsuccess = function() { resolve(req.result); };
        req.onerror = function() { resolve(undefined); };
      } catch(e) { resolve(undefined); }
    });
  }

  function put(store, key, value) {
    if (!_db) return Promise.resolve();
    return new Promise(function(resolve, reject) {
      try {
        var tx = _db.transaction(store, 'readwrite');
        tx.objectStore(store).put(value, key);
        tx.oncomplete = function() { resolve(); };
        tx.onerror = function() { reject(tx.error); };
      } catch(e) { resolve(); }
    });
  }

  function del(store, key) {
    if (!_db) return Promise.resolve();
    return new Promise(function(resolve) {
      try {
        var tx = _db.transaction(store, 'readwrite');
        tx.objectStore(store).delete(key);
        tx.oncomplete = function() { resolve(); };
        tx.onerror = function() { resolve(); };
      } catch(e) { resolve(); }
    });
  }

  function getAll(store) {
    if (!_db) return Promise.resolve([]);
    return new Promise(function(resolve) {
      try {
        var tx = _db.transaction(store, 'readonly');
        var req = tx.objectStore(store).getAll();
        req.onsuccess = function() { resolve(req.result || []); };
        req.onerror = function() { resolve([]); };
      } catch(e) { resolve([]); }
    });
  }

  return {
    open: open,
    ensureStore: ensureStore,
    ensureStores: ensureStores,
    get: get,
    put: put,
    delete: del,
    getAll: getAll,
    getMeta: function(key) { return get('_meta', key); },
    setMeta: function(key, value) { return put('_meta', key, value); },
    getPending: function() { return getAll('_pending'); },
    addPending: function(change) {
      if (!_db) return Promise.resolve();
      return new Promise(function(resolve, reject) {
        try {
          var tx = _db.transaction('_pending', 'readwrite');
          tx.objectStore('_pending').add(change);
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function() { reject(tx.error); };
        } catch(e) { resolve(); }
      });
    },
    clearPending: function() {
      if (!_db) return Promise.resolve();
      return new Promise(function(resolve) {
        var tx = _db.transaction('_pending', 'readwrite');
        tx.objectStore('_pending').clear();
        tx.oncomplete = function() { resolve(); };
      });
    }
  };
})();
</script>
