<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="dbUI">
  <!-- The app's DEFAULT icon, used by any schema that does not set `icons` (see dev/SCHEMA.md).
       Deliberately generic: this file used to be a beehive, which is bishopric iconography, so every
       other database installed itself under one deployment's mark. That artwork now lives with the
       schema it belongs to, in examples/bishopric-favicon.svg.
       A table — header row, two rows, one column rule — because that is what the app is, and because
       it is still legible at 16px where anything finer turns to mush.
       Blue is the app's own default `primary` (#4285f4 in app-core's Vuetify theme). -->
  <rect width="32" height="32" rx="7" fill="#4285f4"/>
  <!-- the sheet -->
  <rect x="6" y="7" width="20" height="18" rx="2.5" fill="#ffffff"/>
  <!-- header band: rounded at the top to sit flush inside the sheet's corners -->
  <path d="M6 9.5 a2.5 2.5 0 0 1 2.5 -2.5 h15 a2.5 2.5 0 0 1 2.5 2.5 v3.2 h-20 z" fill="#a8c7fa"/>
  <!-- one row rule and one column rule: enough to read as a grid, few enough to survive 16px -->
  <path d="M6 18.6 h20" stroke="#4285f4" stroke-width="1.6"/>
  <path d="M14 12.7 v12.3" stroke="#4285f4" stroke-width="1.6"/>
</svg>
